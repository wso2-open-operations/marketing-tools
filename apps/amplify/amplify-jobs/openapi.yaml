openapi: 3.0.1
info:
  title: Amplify Jobs
  version: 0.3.0
  description: >-
    Internal worker; Project visibility only, never published. The scheduler (akornatskyy/scheduler, ADR-026) and amplify-api
    ("Save & Share Now") call these endpoints. ADR-003, ADR-025.
security:
  - InternalKey: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /ready:
    get:
      operationId: getReadiness
      security: []
      description: >-
        Readiness. The body reports the database (breaker not open and `SELECT 1` answers) in `status`, `database` and
        `breakers`; LinkedIn, Novera and the token keys are reported but not fatal, because a run defers those rows
        (ADR-025). A database blip keeps the answer 200 while the database is configured, because Choreo stops routing
        on any non-2xx readiness response; `POST /runs` answers the scheduler's retryable 503 instead.
      responses:
        "200":
          description: In rotation (the body says whether the database answered)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadyReport"}
        "503":
          description: The database is not configured, so the worker can never do its work
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReadyReport"}
  /runs:
    post:
      operationId: startRun
      description: Runs the outbox once (announcements, sharing, scoring) and returns the run log. One run at a time across replicas.
      parameters:
        - {name: X-Correlation-ID, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: Run finished
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunReport"}
        "202":
          description: Another run is in progress (not a failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [SKIPPED]}
                  reason: {type: string, enum: [RUN_IN_PROGRESS]}
        "503": {description: Database unavailable}
        "500": {description: Run failed}
  /maintenance/partitions:
    post:
      operationId: runPartitionMaintenance
      description: >-
        Daily upkeep (B10) plus expired Idempotency-Key purge (ADR-024). One pass at a time across replicas: a pass
        that outlives the scheduler's 180 s deadline is not started again by its retry, which gets 202 `SKIPPED`
        instead of a second pass.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MaintenanceReport"}
        "202":
          description: Another pass holds the maintenance lock (not a failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [SKIPPED]}
                  reason: {type: string, enum: [MAINTENANCE_IN_PROGRESS]}
        "503": {description: Database unavailable}
        "500": {description: Maintenance failed}
  /engagement/sync:
    post:
      operationId: syncEngagement
      description: >-
        Community Management engagement sync (phase 4). Off unless `engagement.sync_enabled` is true (status `OFF`).
        Reads reactions and comments on the page's open campaign posts from their cursors, then the page's share
        notifications since the last run, counting every call against `engagement.daily_call_budget` and stopping
        at the budget, on a 429 or an open breaker (cursors kept). Actors that are not connected employees are dropped;
        comment text is never stored. Each new engagement is written with its `EngagementRecorded` event, so the next
        `POST /runs` scores it. One sync at a time across replicas (own lock and connection): a second caller gets 202.
        The scheduler key may call it.
      parameters:
        - {name: X-Correlation-ID, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: Done (or OFF / NOT_CONFIGURED / NOT_CONNECTED / NEEDS_RECONNECT, with no sync counts)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EngagementSyncResult"}
        "202":
          description: Another sync holds the lock (not a failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [SKIPPED]}
                  reason: {type: string, enum: [SYNC_IN_PROGRESS]}
        "503": {description: Database unavailable}
        "500": {description: Sync failed}
  /coins/verify:
    post:
      operationId: verifyCoins
      description: >-
        Pre-coin verification (V027, ADR-048 amendment), run by the scheduler an hour before the conversion. Off unless
        `coin.wallets_enabled` is true (202 `WALLETS_OFF`). Checks every HELD engagement ledger row the conversion could
        take that was never checked, or was verified more than half of `coin.verify_max_age_hours` ago, on LinkedIn:
        an in-app share or native reshare with the employee's own token (the page token when they have none or it may
        not read the post), a reaction or comment with the page token. Still there: VERIFIED (the conversion takes a row
        only while that is within `coin.verify_max_age_hours`). Gone: the row is reversed by the system, reason "No
        longer on LinkedIn". Can't be checked (no usable token, 403, no URN): the row becomes action required for the PO
        team. Own posts, adjustments and reversals are never checked. Calls count against `engagement.daily_call_budget`
        (page token, shared with the engagement sync) and `coin.verify_member_daily_call_budget` (member tokens) per UTC
        day; a spent budget, a 429 or LinkedIn being down stops the run (STOPPED) and later runs carry on. Takes the
        Coins lock on its own connection, so it never runs beside a conversion. The scheduler key may call it.
      parameters:
        - {name: X-Correlation-ID, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: The run (DONE, PARTIAL at the time limit, or STOPPED with a reason)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyReport"}
        "202":
          description: Not run (not a failure)
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: {type: string, enum: [SKIPPED]}
                  reason: {type: string, enum: [COINS_IN_PROGRESS, WALLETS_OFF, NOT_CONFIGURED]}
        "503": {description: Database unavailable}
        "500": {description: Verification failed (rows already checked keep their outcome; the next call carries on)}
  /coins/convert:
    post:
      operationId: convertCoins
      description: >-
        Automatic Coins conversion (phase 2, ADR-048). Off unless `coin.wallets_enabled` is true (202 `WALLETS_OFF`;
        points keep counting). For the period of `coin.schedule` (`2026-12`, `2026-W49` or `2026-12-01`, UTC): first
        reconciles every PENDING/UNKNOWN issue of earlier runs against the Coins service's ledger (search by master
        wallet, recipient, amount and time; one match is SENT, none is FAILED and converts again, more than one waits
        for an operator); then plans every employee's HELD points not yet taken plus their carry in whole blocks
        (`coin.block_points` = `coin.block_coins`) within `coin.max_coins_per_person` and `coin.max_coins_per_run`; stops
        before sending anything when the master wallet can't cover the run; then, per employee, writes the issue
        PENDING and tags the rows, transfers outside the transaction, and marks the rows PAID and the issue SENT.
        A refusal marks the issue FAILED and gives the rows back; no clear answer marks it UNKNOWN and stops the run.
        Employees without a captured wallet are SKIPPED_NO_WALLET (points stay HELD). Re-running a period sends
        nothing for its SENT issues. One conversion at a time across replicas (own lock and connection). The scheduler
        key may call it.
      parameters:
        - {name: X-Correlation-ID, in: header, required: false, schema: {type: string}}
      responses:
        "200":
          description: The run (DONE, PARTIAL at the time limit, or STOPPED with a reason)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CoinRunReport"}
        "202":
          description: Not run (not a failure)
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: {type: string, enum: [SKIPPED]}
                  reason: {type: string, enum: [CONVERSION_IN_PROGRESS, WALLETS_OFF, COINS_NOT_CONFIGURED]}
        "503": {description: Database unavailable}
        "500": {description: Conversion failed (the run row stays RUNNING; the next call reopens it)}
  /maintenance/leavers:
    post:
      operationId: sweepLeavers
      description: >-
        Runs only the leaver sweep (the daily maintenance run includes it): employees missing from the people directory
        who have not used Amplify for `leaverGraceDays`. `OFF` does nothing; `DRY_RUN` reports who would be erased
        (pseudonymous ids only); `ERASE` erases them with `identity_erase_employee`. A directory that lists too few
        people, or more leavers than `leaverMaxPerRun`, erases nobody. ADR-040.
      responses:
        "200": {description: What the sweep did}
        "401": {description: Missing or wrong key}
        "403": {description: Scheduler key on a route it may not call}
        "503": {description: Database unavailable}
  /maintenance/rebuild-recognition:
    post:
      operationId: rebuildRecognition
      responses:
        "200":
          description: Rebuilt
          content:
            application/json:
              schema:
                type: object
                properties:
                  standingVersion: {type: integer}
        "503": {description: Database unavailable}
        "500": {description: Rebuild failed}

components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-Amplify-Internal-Key
      description: >-
        Two secrets (each at least 32 characters, different values). The internal key, held by amplify-api, opens
        every route. The scheduler key, held by the scheduler's jobs, opens only POST /runs,
        POST /maintenance/partitions, POST /engagement/sync, POST /coins/verify and POST /coins/convert; on any other
        route it is 403. Every call except the two probes needs one;
        a missing or wrong key is 401. ADR-039.
  schemas:
    HealthStatus:
      type: object
      required: [component, status]
      properties:
        component: {type: string}
        status: {type: string, enum: [UP, DOWN]}
    ReadyReport:
      type: object
      required: [component, status, database, runInProgress, breakers]
      properties:
        component: {type: string}
        status: {type: string, enum: [UP, DOWN]}
        database: {type: string, enum: [UP, DOWN]}
        runInProgress: {type: boolean}
        breakers:
          type: object
          additionalProperties: {type: string}
    RunReport:
      type: object
      properties:
        runId: {type: string}
        correlationId: {type: string, nullable: true}
        startedAt: {type: string, format: date-time}
        claimed: {type: integer}
        succeeded: {type: integer}
        retried: {type: integer}
        deferred: {type: integer}
        failed: {type: integer}
        staleReleased: {type: integer}
        linkedinPosts: {type: integer}
        connections:
          type: object
          properties:
            expiring: {type: integer}
            needsReconnect: {type: integer}
        breakers:
          type: object
          additionalProperties: {type: string, enum: [CLOSED, HALF_OPEN, OPEN, NOT_CONFIGURED]}
        durationMs: {type: integer}
    EngagementSyncResult:
      type: object
      required: [status, tokenRefreshed]
      properties:
        status:
          type: string
          enum: [OFF, NOT_CONFIGURED, NOT_CONNECTED, NEEDS_RECONNECT, DONE, BUDGET_REACHED, RATE_LIMITED, UNAVAILABLE,
            UNAUTHORIZED, REJECTED]
        tokenRefreshed: {type: boolean}
        sync:
          type: object
          nullable: true
          properties:
            status: {type: string}
            campaigns: {type: integer}
            calls: {type: integer}
            reactions: {type: integer}
            comments: {type: integer}
            reposts: {type: integer}
            alreadyRecorded: {type: integer}
            dropped: {type: integer}
    VerifyReport:
      type: object
      required: [status, checked, verified, removed, actionRequired, unverifiableByReason]
      properties:
        status: {type: string, enum: [DONE, PARTIAL, STOPPED]}
        stopReason: {type: string, nullable: true, enum: [BUDGET_REACHED, RATE_LIMITED, UNAVAILABLE, null]}
        checked: {type: integer}
        verified: {type: integer}
        removed: {type: integer, description: Gone from LinkedIn and reversed}
        actionRequired: {type: integer, description: Could not be checked; now action required}
        unverifiableByReason:
          type: object
          description: NO_TOKEN, TOKEN_EXPIRED, NOT_PERMITTED, NO_ACTIVITY, SOURCE_NOT_FOUND, MEMBER_ERASED
          additionalProperties: {type: integer}
    CoinRunReport:
      type: object
      required: [status, reconciledSent, reconciledNotSent, stillOpen, sent, coinsSent, failed, unknown, skippedNoWallet,
        passedOver]
      properties:
        status: {type: string, enum: [DONE, PARTIAL, STOPPED]}
        stopReason: {type: string, nullable: true, enum: [INSUFFICIENT_BALANCE, COINS_UNAVAILABLE, OUTCOME_UNKNOWN]}
        period: {type: string, nullable: true}
        reconciledSent: {type: integer, description: Open issues of earlier runs found at the Coins service}
        reconciledNotSent: {type: integer, description: Open issues the Coins service never recorded (they convert again)}
        stillOpen: {type: integer, description: Open issues not settled (too recent, ambiguous, or the search failed)}
        sent: {type: integer}
        coinsSent: {type: integer}
        failed: {type: integer}
        unknown: {type: integer}
        skippedNoWallet: {type: integer}
        passedOver: {type: integer, description: "Already SENT this period, an issue still open, or a retry not due"}
        totals:
          type: object
          nullable: true
          description: The period's totals over every run of it
          properties:
            issuesSent: {type: integer}
            coinsSent: {type: integer}
            issuesFailed: {type: integer}
            issuesUnknown: {type: integer}
            issuesSkipped: {type: integer}
    MaintenanceReport:
      type: object
      properties:
        audit_partitions_created: {type: integer}
        token_partitions_created: {type: integer}
        token_partitions_dropped: {type: integer}
        audit_partitions_dropped: {type: integer}
        outbox_rows_purged: {type: integer}
        oauth_states_swept: {type: integer}
        idempotency_keys_purged: {type: integer}
        token_rotation:
          type: object
          description: Key rotation step (provider_token rows re-sealed under the active key). Never fails the call.
          required: [status, resealed, skipped, failed]
          properties:
            status: {type: string, enum: [DONE, PARTIAL, NOT_CONFIGURED, FAILED]}
            resealed: {type: integer}
            skipped: {type: integer}
            failed: {type: integer}
