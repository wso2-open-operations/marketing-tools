# OpenChoreo workload descriptor (M8c), read by `occ workload create --descriptor`. Type: deployment/service.
# Same endpoints, ports and env names as apps/amplify/linkedin/apps/mock_linkedin/.choreo/component.yaml (scripts/check-descriptors.sh).
# Choreo Project visibility -> `project`; Public -> `external`. Secrets: valueFrom.secretRef (SecretReference /
# External Secrets); plain values come from the environment's ReleaseBinding/overrides.
apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: mock-linkedin
endpoints:
  - name: mock-linkedin-api
    type: HTTP
    port: 9090
    visibility:
      - project
  - name: mock-linkedin-www
    type: HTTP
    port: 9091
    visibility:
      - external
configurations:
  env:
    - name: BAL_CONFIG_VAR_LISTENERHOST
      value: "0.0.0.0"
    - name: BAL_CONFIG_VAR_WWWBASEURL
      value: ""
    - name: BAL_CONFIG_VAR_CLIENTID
      value: ""
    - name: BAL_CONFIG_VAR_CLIENTSECRET
      valueFrom:
        secretRef:
          name: mock-linkedin-secrets
          key: BAL_CONFIG_VAR_CLIENTSECRET
    - name: BAL_CONFIG_DATA
      value: ""
