components:
  securitySchemes:
    linkedinOAuth2:
      type: oauth2
      description: LinkedIn 3-legged OAuth 2.0 (authorization code).
      flows:
        authorizationCode:
          authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
          tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
          scopes:
            r_organization_social: LinkedIn permission `r_organization_social`
            rw_organization_admin: LinkedIn permission `rw_organization_admin`
            w_organization_social: LinkedIn permission `w_organization_social`
            rw_ads: LinkedIn permission `rw_ads`
            r_ads: LinkedIn permission `r_ads`
  parameters:
    LinkedInVersion:
      name: LinkedIn-Version
