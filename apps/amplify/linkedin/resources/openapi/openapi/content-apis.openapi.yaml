openapi: 3.0.3
info:
  title: Content APIs
  version: 1.0.0
  description: 'Please note that these are versioned set of APIs and they are different than the earlier one.


    These must be used with the **content-api-env-versioning** environment.


    Content APIs are the APIs that are published with the versioned release. These APIs bring capabilities to partners/developers
    to create rich content via LinkedIn Ads with minimal operational and technical overhead.


    **You must apply for access to the Marketing Developer Platform in order to use these APIs. See the** [**Developer
    Portal**](https://developer.linkedin.com/product-catalog/marketing/campaign-management) **on how to apply.**


    _Generated from the Postman collection "Content APIs". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - r_organization_social
  - rw_organization_admin
  - w_organization_social
  - rw_ads
  - r_ads
tags:
- name: Use Cases
paths:
  /inMailContents:
    post:
      operationId: postInMailContents
      summary: Create / update / action on inMailContents
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Create InMail Content**: API to create an inMail Content.

        - **Send Test InMail** (`action=sendTestInMail`): API to send/share an inMail Content.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum:
          - sendTestInMail
        description: Rest.li action name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInMailContentsRequest'
            examples:
              createInMailContent:
                summary: Create InMail Content
                value:
                  account: '{{sponsoredaccount_id}}'
                  name: This is Inmail Ad for 2B Testing 09-22-2026
                  subject: Inmail Ad for 2B Testing
                  sender: '{{person_id}}'
                  customFooter: terms and conditions
                  htmlBody: sample body
                  subContent:
                    regular:
                      callToActionText: sample string
                      callToActionLandingPageUrl: http://www.linkedin.com
                      rightRailAdPicture: '{{image_id}}'
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: integer
              examples:
                createInMailContent:
                  summary: Create InMail Content
                  value:
                    message: Validation failed because [{reason=SINMAIL_SENDER_NOT_APPROVED, field=sender, type=INVALID_VALUE,
                      message=Sponsored InMail sender is not approved for Account, parameters={urn=member, account=urn:li:sp
                    status: 400
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: batchGetInMailContent
      summary: Batch Get InMail Content
      tags:
      - Use Cases
      description: API to retrieve an inMail Content in Batches.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: X-RestLi-Method
        in: header
        required: false
        description: Rest.li method override used for batch / partial-update style calls.
        schema:
          type: string
          enum:
          - BATCH_CREATE
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Batch ids in Rest.li 2.0 list syntax, e.g. `List(id1,id2)`.
        example: '{encoded adInMailContentId}'
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /inMailContents/{inMailContentId}:
    get:
      operationId: getInMailContent
      summary: Get InMail Content
      tags:
      - Use Cases
      description: API to retrieve an inMail Content.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: inMailContentId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: updateInMailContent
      summary: Update InMail Content
      tags:
      - Use Cases
      description: API to update an inMail Content.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: inMailContentId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInMailContentRequest'
            examples:
              updateInMailContent:
                summary: Update InMail Content
                value:
                  patch:
                    $set:
                      name: test strings new
      responses:
        '204':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /dms-uploads/{uploadPath}:
    put:
      operationId: putDmsUploads
      summary: Upsert dms-uploads
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Upload an Image**: This is a generic Upload URL call without init.

        - **Upload a Video**: This is a generic API to upload the data.

        - **Upload the Document file (select a document file in the Body for postman to use)**'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: uploadPath
        in: path
        required: true
        description: Remainder of the upload URL returned by the corresponding initializeUpload call (use that URL
          verbatim).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          headers:
            etag:
              schema:
                type: string
              description: Entity tag.
        '201':
          description: Created
        default:
          $ref: '#/components/responses/Error'
      servers:
      - url: https://www.linkedin.com
  /images:
    post:
      operationId: initializeImageUpload
      summary: Initialize Image Upload
      tags:
      - Use Cases
      description: Use the `initializeUpload` action to register the upload. When you initialize, you declare the
        upcoming upload. Use the upload URL to upload the image.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - initializeUpload
        description: Rest.li action name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeImageUploadRequest'
            examples:
              initializeImageUpload:
                summary: Initialize Image Upload
                value:
                  initializeUploadRequest:
                    owner: urn:li:organization:{{organization_id}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeImageUploadResponse'
              examples:
                initializeImageUpload:
                  summary: Initialize Image Upload
                  value:
                    value:
                      uploadUrlExpiresAt: 1790211678812
                      uploadUrl: https://www.linkedin.com/dms-uploads/sp/v2/D4D10AQFkoCM3CIiVkw/uploaded-image/B4DaDLyAZPGkAA-/0?REDACTED_SIGNED_QUERY
                      image: urn:li:image:D4D10AQFkoCM3CIiVkw
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getImages
      summary: Query images
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Get Multiple Images**: This API rerieve multiple images.

        - **Get Multiple Videos**: This API retrieves multiple videos.

        - **Get multiple documents**'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Batch ids in Rest.li 2.0 list syntax, e.g. `List(id1,id2)`.
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /images/{imageUrn}:
    get:
      operationId: getASingleImage
      summary: Get a single Image
      tags:
      - Use Cases
      description: This API rerieve a single image.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: imageUrn
        in: path
        required: true
        description: URN of the resource (URL-encoded).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetASingleImageResponse'
              examples:
                getASingleImage:
                  summary: Get a single Image
                  value:
                    downloadUrl: https://media.licdn.com/dms/image/v2/D4D10AQFkoCM3CIiVkw/image-shrink_480/B4DaDL16IcHMAQ-/0/1790126301956?e=1790733600&v=beta&t=eO13xMmNAUZto1K3EZDmD5mqCDcRtk1RANIwHJ887gg
                    owner: urn:li:organization:2414183
                    id: urn:li:image:D4D10AQFkoCM3CIiVkw
                    downloadUrlExpiresAt: 1790733600000
                    status: AVAILABLE
        default:
          $ref: '#/components/responses/Error'
  /posts:
    post:
      operationId: postPosts
      summary: Create / update / action on posts
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Create Image Content**: This API creates an image content.

        - **Image Ad Account**

        - **Video Ad Post**

        - **Create Organic Post**: Simplest form of post creation where an organic post is made ith a sample text
        at a page.

        - **Create document content**'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPostsRequest'
            examples:
              createImageContent:
                summary: Create Image Content
                value:
                  author: urn:li:organization:{{org_id}}
                  commentary: This is Image Ad for 2B Testing 09-22-2026
                  visibility: PUBLIC
                  distribution:
                    feedDistribution: MAIN_FEED
                    targetEntities: []
                    thirdPartyDistributionChannels: []
                  content:
                    media:
                      id: '{{image_id}}'
                  lifecycleState: PUBLISHED
                  isReshareDisabledByAuthor: false
              imageAdAccount:
                summary: Image Ad Account
                value:
                  adContext:
                    dscAdAccount: urn:li:sponsoredAccount:508915158
                    dscStatus: ACTIVE
                  author: urn:li:organization:2414183
                  commentary: Sample Image Post
                  visibility: PUBLIC
                  distribution:
                    feedDistribution: NONE
                  content:
                    media:
                      title: title of the image
                      id: urn:li:image:D4D10AQFkoCM3CIiVkw
                  lifecycleState: PUBLISHED
                  isReshareDisabledByAuthor: true
              videoAdPost:
                summary: Video Ad Post
                value:
                  adContext:
                    dscAdAccount: '{{sponsoredaccount_id}}'
                    dscStatus: ACTIVE
                  author: urn:li:organization:{{org_id}}
                  commentary: Sample Video Post
                  visibility: PUBLIC
                  distribution:
                    feedDistribution: NONE
                  content:
                    media:
                      title: title of the video
                      id: urn:li:video:D4D10AQEramjQvYp0Hg
                  lifecycleState: PUBLISHED
                  isReshareDisabledByAuthor: true
              createOrganicPost:
                summary: Create Organic Post
                value:
                  author: '{{organization_urn}}'
                  commentary: Sample Video Post
                  visibility: PUBLIC
                  distribution:
                    feedDistribution: NONE
                    targetEntities:
                    - geoLocations:
                      - '{{urn_geo}}'
                      seniorities:
                      - urn:li:seniority:3
                    thirdPartyDistributionChannels: []
                  content:
                    media:
                      title: title of the video
                      id: '{[urn_video}}'
                  lifecycleState: PUBLISHED
                  isReshareDisabledByAuthor: true
              createDocumentContent:
                summary: Create document content
                value:
                  author: urn:li:organization:{{organization_id}}
                  commentary: test strings!
                  visibility: PUBLIC
                  distribution:
                    feedDistribution: MAIN_FEED
                    targetEntities: []
                    thirdPartyDistributionChannels: []
                  content:
                    media:
                      title: Example.pdf
                      id: urn:li:document:{{document_asset_id}}
                  lifecycleState: PUBLISHED
                  isReshareDisabledByAuthor: false
      responses:
        '201':
          description: Created
          headers:
            location:
              schema:
                type: string
              description: URL of the created resource.
            x-restli-id:
              schema:
                type: string
              description: Id (or URN) of the created resource.
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getPosts2
      summary: Query posts
      tags:
      - Use Cases
      description: "This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`\
        \ / body shape). Variants seen in the source collection:\n- **Fetch multiple Image Content**: This API rerieve\
        \ content from multiple images.\n- **Get Multiple Post by URN**: Multiple posts can be retrieved and viewed\
        \ in a single API call by passing in multiple UGC Posts or share URNs into the `ids` parameter. The UGC\
        \ Post URNs should be passed in `List` format and should be encoded as shown in the examples below. Note\
        \ that the `,` in the `List` separating each URN does \n- **Find post by Account** (`q=dscAdAccount`): You\
        \ can retrieve all posts with the specific Sponsored Account and the content types with the following parameters:\n\
        - **Fetch multiple document content**"
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: X-RestLi-Method
        in: header
        required: false
        description: Rest.li method override used for batch / partial-update style calls.
        schema:
          type: string
          enum:
          - BATCH_CREATE
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Batch ids in Rest.li 2.0 list syntax, e.g. `List(id1,id2)`.
        example: List({encoded postId},{encoded postId})
        allowReserved: true
      - name: dscAdAccount
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - dscAdAccount
        description: Rest.li finder name. Selects which query this call performs.
      - name: dscAdTypes
        in: query
        required: false
        schema:
          type: string
        example: List(STANDARD,VIDEO)
        allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPosts2Response'
              examples:
                findPostByAccount:
                  summary: Find post by Account
                  value:
                    paging:
                      start: 0
                      count: 10
                      links:
                      - type: application/json
                        rel: next
                        href: /rest/posts?q=dscAdAccount&dscAdTypes=List(STANDARD,VIDEO)&start=10&count=10&dscAdAccount=urn%3Ali%3AsponsoredAccount%3A508915158
                      total: 0
                    elements:
                    - lifecycleState: PUBLISHED
                      lastModifiedAt: 1790192653029
                      visibility: PUBLIC
                      publishedAt: 1790192623027
                      author: urn:li:organization:2414183
                      distribution:
                        feedDistribution: NONE
                        thirdPartyDistributionChannels: []
                      content:
                        media:
                          title: Title of the video
                          id: urn:li:video:D4D10AQEramjQvYp0Hg
                      lifecycleStateInfo:
                        isEditedByAuthor: false
                      isReshareDisabledByAuthor: false
                      createdAt: 1790192623027
                      id: urn:li:ugcPost:7508612078690021376
                      commentary: commentary about the post
                      adContext:
                        dscStatus: ACTIVE
                        dscAdType: VIDEO
                        isDsc: true
                        dscAdAccount: urn:li:sponsoredAccount:508915158
                    - lifecycleState: PUBLISHED
                      lastModifiedAt: 1790188714629
                      visibility: PUBLIC
                      publishedAt: 1790188688915
                      author: urn:li:organization:2414183
                      distribution:
                        feedDistribution: NONE
                        thirdPartyDistributionChannels: []
                      content:
                        media:
                          title: title of the video
                          id: urn:li:video:D4D10AQEramjQvYp0Hg
                      lifecycleStateInfo:
                        isEditedByAuthor: false
                      isReshareDisabledByAuthor: true
                      createdAt: 1790188688915
                      id: urn:li:ugcPost:7508595577971105792
                      commentary: Sample Video Post
                      adContext:
                        dscStatus: ACTIVE
                        dscAdType: VIDEO
                        isDsc: true
                        dscAdAccount: urn:li:sponsoredAccount:508915158
        default:
          $ref: '#/components/responses/Error'
  /posts/{postId}:
    get:
      operationId: getPosts
      summary: Query posts
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Get Image Content**: This API rerieve the content associated with a single image.

        - **Get Posts by URN**: Creating posts with image requires uploading an image asset to obtain a Image URN
        (urn:li:image:{id}) for creating the post. See the [Images API](https://docs.microsoft.com/en-us/linkedin/marketing/integrations/community-management/shares/images-api?view=li-lms-2022-08) for
        instructions on how to do'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: postId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPostsResponse'
              examples:
                getImageContent:
                  summary: Get Image Content
                  value:
                    isReshareDisabledByAuthor: false
                    createdAt: 1790126842720
                    lifecycleState: PUBLISHED
                    lastModifiedAt: 1790126866524
                    visibility: PUBLIC
                    publishedAt: 1790126842720
                    author: urn:li:organization:2414183
                    id: urn:li:share:7508336175921934336
                    distribution:
                      feedDistribution: MAIN_FEED
                      thirdPartyDistributionChannels: []
                    content:
                      media:
                        id: urn:li:image:D4D10AQFkoCM3CIiVkw
                    commentary: This is Image Ad for 2B Testing 09-22-2026
                    lifecycleStateInfo:
                      isEditedByAuthor: false
                getPostsByURN:
                  summary: Get Posts by URN
                  value:
                    lifecycleState: PUBLISHED
                    lastModifiedAt: 1790188714629
                    visibility: PUBLIC
                    publishedAt: 1790188688915
                    author: urn:li:organization:2414183
                    distribution:
                      feedDistribution: NONE
                      thirdPartyDistributionChannels: []
                    content:
                      media:
                        title: title of the video
                        id: urn:li:video:D4D10AQEramjQvYp0Hg
                    lifecycleStateInfo:
                      isEditedByAuthor: false
                    isReshareDisabledByAuthor: true
                    createdAt: 1790188688915
                    id: urn:li:ugcPost:7508595577971105792
                    commentary: Sample Video Post
                    adContext:
                      dscStatus: ACTIVE
                      dscAdType: VIDEO
                      isDsc: true
                      dscAdAccount: urn:li:sponsoredAccount:508915158
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAPost
      summary: Delete a Post
      tags:
      - Use Cases
      description: 'Post deletions are idempotent. Deletion requests for a previously deleted UGC Post will return
        a `204` code - No Content.


        ####'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: postId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '204':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /videos:
    post:
      operationId: postVideos
      summary: Create / update / action on videos
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Initialize Video Upload** (`action=initializeUpload`): Use the `initializeUpload` action to register
        the upload. When you initialize, you declare the upcoming upload. Use the upload URL from the `uploadInstructions` to
        upload the video.

        - **Finalize Video** (`action=finalizeUpload`)'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - initializeUpload
          - finalizeUpload
        description: Rest.li action name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVideosRequest'
            examples:
              initializeVideoUpload:
                summary: Initialize Video Upload
                value:
                  initializeUploadRequest:
                    owner: urn:li:organization:{{organization_id}}
                    fileSizeBytes: 1055736
                    uploadCaptions: false
                    uploadThumbnail: false
              finalizeVideo:
                summary: Finalize Video
                value:
                  finalizeUploadRequest:
                    video: urn:li:video:D4D10AQEramjQvYp0Hg
                    uploadToken: ''
                    uploadedPartIds:
                    - /ambry-video/signedId/REDACTED_TOKEN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVideosResponse'
              examples:
                initializeVideoUpload:
                  summary: Initialize Video Upload
                  value:
                    value:
                      uploadUrlsExpireAt: 1790214636386
                      video: urn:li:video:D4D10AQEramjQvYp0Hg
                      uploadInstructions:
                      - uploadUrl: https://www.linkedin.com/dms-uploads/mp/v2/D4D10AQEramjQvYp0Hg/uploadedVideo/B4DaDL9SdTHMAA-?REDACTED_SIGNED_QUERY
                        lastByte: 1055735
                        firstByte: 0
                      uploadToken: ''
        default:
          $ref: '#/components/responses/Error'
  /videos/{videoId}:
    get:
      operationId: getASingleVideo
      summary: Get a single video
      tags:
      - Use Cases
      description: This API retrieves a single video.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: videoId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner:
                    type: string
                  status:
                    type: string
                  id:
                    type: string
              examples:
                getASingleVideo:
                  summary: Get a single video
                  value:
                    owner: urn:li:organization:2414183
                    status: WAITING_UPLOAD
                    id: urn:li:video:D4D10AQEramjQvYp0Hg
        default:
          $ref: '#/components/responses/Error'
  /adAccounts/{adAccountId}/creatives:
    post:
      operationId: postAdAccountsCreatives
      summary: Create / update / action on creatives
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
