  /adAccounts/{adAccountId}/adCampaignGroups:
    post:
      operationId: postAdAccountsAdCampaignGroups
      summary: Create / update / action on adCampaignGroups
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Create a Campaign Group**: Campaign groups can be created in ACTIVE or DRAFT state. You can change ACTIVE
        to ARCHIVED or PAUSED. This example [creates a Campaign Group](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-campaign-groups?tabs=http#create-a-campaign-group) in
        the s

        - **Create Multiple Campaign Groups**: Campaign groups can be created in ACTIVE or DRAFT state. You can
        change ACTIVE to ARCHIVED or PAUSED. This example [creates multiple Campaign Groups](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-campaign-groups?tabs=http#batch-create-campaign-gro

        - **Update Multiple Campaign Groups**: Multiple campaign groups can be updated with a partial update. This
        example updates the amount and currencyCode for one Campaign Group and status for another Campaign Group
        using the RestLi method BATCH_PARTIAL_UPDATE.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      - name: X-RestLi-Method
        in: header
        required: false
        description: Rest.li method override used for batch / partial-update style calls.
        schema:
          type: string
          enum:
          - BATCH_CREATE
          - BATCH_PARTIAL_UPDATE
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Batch ids in Rest.li 2.0 list syntax, e.g. `List(id1,id2)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAdAccountsAdCampaignGroupsRequest'
            examples:
              createACampaignGroup:
                summary: Create a Campaign Group
                value:
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  name: CampaignGroup1
                  runSchedule:
                    end: 1790985600000
                    start: 1790121600000
                  status: ACTIVE
                  totalBudget:
                    amount: '1000.00'
                    currencyCode: USD
              createMultipleCampaignGroups:
                summary: Create Multiple Campaign Groups
                value:
                  elements:
                  - account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                    name: CampaignGroup2
                    runSchedule:
                      end: 1635493862000
                      start: 1635321062000
                    status: ACTIVE
                    totalBudget:
                      amount: '60000.00'
                      currencyCode: USD
                  - account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                    name: CampaignGroup3
                    runSchedule:
                      end: 1635493862000
                      start: 1635321062000
                    status: ACTIVE
                    totalBudget:
                      amount: '30000.00'
