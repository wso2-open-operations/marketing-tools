openapi: 3.0.3
info:
  title: Campaign Management
  version: 1.0.0
  description: '**You must apply for access to the Marketing Developer Platform in order to use these APIs. See
    the** [<b>Developer Portal</b>](https://developer.linkedin.com/product-catalog/marketing/campaign-management)
    **on how to apply.**


    This collection aims to focus on different Campaign Management use cases and should be used with the **campaign-management-env-versioning**
    environment.


    \--All requests for the Campaign Management API collection are in the Restli 2.0 format--


    **Prerequisite:** Perform steps 1 & 2 from the [Generate An Access Token using Postman](https://docs.microsoft.com/linkedin/shared/authentication/generate-an-access-token?context=linkedin/marketing/context)
    of our online documentation for this request to work.


    This is an example for generating an access token with the necessary scope to test the Campaign Management collection
    apis.


    The full process your application will need to implement for 3-legged tokens is described in [Authorization
    Code Flow](https://docs.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow?context=linkedin/marketing/context&tabs=HTTPS)


    AuthorizationOAuth 2.0


    _Generated from the Postman collection "Campaign Management". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - rw_ads
  - r_basicprofile
  - w_organization_social
  - w_member_social
  - rw_organization_admin
tags:
- name: Use Cases
paths:
  /adAccountUsers/{adAccountUserKey}:
    put:
      operationId: createAdAccountUser
      summary: Create Ad Account User
      tags:
      - Use Cases
      description: This API example [creates an Ad Account User](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-account-users?tabs=http#create-ad-account-user).
        Creating Ad Account Users grants a member access to an Ad Account.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountUserKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdAccountUserRequest'
            examples:
              createAdAccountUser:
                summary: Create Ad Account User
                value:
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  role: VIEWER
                  user: urn:li:person:{{person_id}}
      responses:
        '204':
          description: No Content
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: fetchAnAdAccountUser
      summary: Fetch an Ad Account User
      tags:
      - Use Cases
      description: 'This API example [fetches an Ad Account User](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-account-users?tabs=http#get-ad-account-user).
        Fetching an existing Ad Account User requires both account and user parameters.


        The person id can also be retrieved from the [/me](https://docs.microsoft.com/linkedin/shared/integrations/people/profile-api#retrieve-current-members-profile) endpoint.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountUserKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAnAdAccountUserResponse'
              examples:
                fetchAnAdAccountUser:
                  summary: Fetch an Ad Account User
                  value:
                    role: ACCOUNT_MANAGER
                    changeAuditStamps:
                      created:
                        actor: urn:li:person:Iw_TtbEfex
                        impersonator: urn:li:servicePrincipal:core-authz-mt
                        time: 1790098793476
                      lastModified:
                        actor: urn:li:person:Iw_TtbEfex
                        impersonator: urn:li:servicePrincipal:core-authz-mt
                        time: 1790098793476
                    user: urn:li:person:qrOweYM47u
                    account: urn:li:sponsoredAccount:508915158
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: updateExistingAdAccountUser
      summary: Update Existing Ad Account User
      tags:
      - Use Cases
      description: This API example [updates an Ad Account User](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-account-users?tabs=http#update-existing-ad-account-user).
        An Ad Account User's role can be updated by using this endpoint.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountUserKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExistingAdAccountUserRequest'
            examples:
              updateExistingAdAccountUser:
                summary: Update Existing Ad Account User
                value:
                  patch:
                    $set:
                      account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                      role: VIEWER
                      user: urn:li:person:{{person_id}}
      responses:
        '204':
          description: No Content
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAnAdAccountUser
      summary: Delete an Ad Account User
      tags:
      - Use Cases
      description: This API example [deletes an Ad Account User](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-account-users?tabs=http#delete-an-ad-account-user).
        Members can be removed from Ad Account access by using the delete Ad Account User endpoint. Deletion requires
        both account and user parameters to look up the appropriate Ad Account User.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountUserKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      responses:
        '204':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /adAccountUsers:
    get:
      operationId: getAdAccountUsers
      summary: Query adAccountUsers
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Find Ad Account Users by Accounts** (`q=accounts`): This API example searches for all Ad Account Users
        by sponsored ad account or multiple sponsored ad accounts. Learn more in our public documentation [here](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-account-users?tabs=http#find-ad-account-users

        - **Fetch the Authenticated User''s Ad Accounts** (`q=authenticatedUser`): This API example retrieves all
        Ad Accounts that an authenticated user has access to. Specifically, this api call will return the Ad Accounts
        associated with the member whose access token is being used! The only required parameter is q=authenticatedUser.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - accounts
          - authenticatedUser
        description: Rest.li finder name. Selects which query this call performs.
      - name: accounts
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdAccountUsersResponse'
              examples:
                findAdAccountUsersByAccounts:
