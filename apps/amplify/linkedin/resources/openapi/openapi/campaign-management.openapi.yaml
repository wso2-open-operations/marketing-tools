  /adAccounts:
    post:
      operationId: postAdAccounts
      summary: Create / update / action on adAccounts
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Create an Ad Account**: This example API [creates an Ad Account](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#create-ad-account)

        - **Create a Test Ad Account**: This API example [creates a "test" ad account](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#creating-a-test-ad-account) by
        including an additional boolean `test` flag to `true` on the payload.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAdAccountsRequest'
            examples:
              createAnAdAccount:
                summary: Create an Ad Account
                value:
                  currency: USD
                  name: Ad account 2B Testing-09-22-2026
                  notifiedOnCampaignOptimization: true
                  notifiedOnCreativeApproval: true
                  notifiedOnCreativeRejection: true
                  notifiedOnEndOfCampaign: true
                  reference: urn:li:organization:{{organization_id}}
                  type: BUSINESS
              createATestAdAccount:
                summary: Create a Test Ad Account
                value:
                  currency: USD
                  name: XYZ Company
                  notifiedOnCampaignOptimization: true
                  notifiedOnCreativeApproval: true
                  notifiedOnCreativeRejection: true
                  notifiedOnEndOfCampaign: true
                  reference: urn:li:organization:{{organization_id}}
                  type: BUSINESS
                  test: true
      responses:
        '201':
          description: Created
          headers:
            location:
              schema:
                type: string
              description: URL of the created resource.
            x-restli-id:
              schema:
                type: string
              description: Id (or URN) of the created resource.
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: getAdAccounts
      summary: Query adAccounts
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Search Accounts by Status** (`q=search`): Use the `q=search` parameter with the adAccountsV2 API to [search
        for ad accounts](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#search-for-accounts) by
        ID, name, reference, type, and status fields. Search criteria can be chaine

        - **Search Account by Type** (`q=search`): Use the `q=search` parameter with the adAccountsV2 API to [search
        for accounts](https://docs.microsoft.com/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#search-for-accounts) by
        ID, name, reference, type, and status fields. Search criteria can be chained t'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - search
        description: Rest.li finder name. Selects which query this call performs.
      - name: search
        in: query
        required: false
        schema:
          type: string
        example: (status:(values:List(ACTIVE)))
        allowReserved: true
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
