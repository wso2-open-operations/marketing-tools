  /organizationAcls:
    get:
      operationId: fetchTheAuthenticatedUserSOrganizationRoles
      summary: Fetch the Authenticated User's Organization Roles
      tags:
      - Use Cases
      description: 'To understand more about verifying Company Page Access visit our public documentation [here](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-access-control-by-role?tabs=http#find-a-members-organization-access-control-information).


