        sponsored account ID.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchTheAdAccountByIDResponse'
              examples:
                fetchTheAdAccountByID:
