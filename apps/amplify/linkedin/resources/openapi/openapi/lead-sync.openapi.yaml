          $ref: '#/components/responses/Error'
  /leadForms:
    get:
      operationId: getLeadForms
      summary: Query leadForms
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **5. Get forms for the user''s Organization** (`q=owner`): At this point, the user has picked the organization
        (compnay page) they are trying to collect leads for and you''ve validated they have the proper company page
        role. This step will retrieve the form(s) associated with the selected organization.

        - **5. Get forms for the chosen Sponsored Account** (`q=owner`): At this point, the user has picked the
        sponsored account they are trying to collect leads for and you have validated they have proper access to
        the ad account and associated company page. This step will retrieve the form(s) associated with the selected
        sponsored account.'
