openapi: 3.0.3
info:
  title: Lead Sync
  version: 1.0.0
  description: 'This collection aims to focus on different lead syncing use cases and should be used with the **lead-sync-env-versioning**
    environment.


    _All requests for the Lead Sync collection are in the Restli 2.0 format and uses OAuth 2.0_


    _Generated from the Postman collection "Lead Sync". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - r_ads
  - r_organization_admin
  - r_liteprofile
  - r_marketing_leadgen_automation
  - r_events
tags:
- name: Use Cases
paths:
  /organizationAcls:
    get:
      operationId: getOrganizationAcls
      summary: Query organizationAcls
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **3. Get the user''s organization(s) (company pages)** (`q=roleAssignee`): In this step, you''ll retrieve
        a list of all the organizations that the logged in user has an approved role for. The authenticated user
        must have one of the roles mentioned in our [permissions](https://learn.microsoft.com/en-us/linkedin/marketing/integrations/lead-sync/leadsync?tabs=http#permissions)

        - **4. Validate the user''s organization role** (`q=roleAssignee`): View the [Organization Access Control](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-access-control-by-role?tabs=http#organization-roles)
        documentation.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - roleAssignee
        description: Rest.li finder name. Selects which query this call performs.
      - name: state
        in: query
        required: false
        schema:
          type: string
        example: APPROVED
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 10
      - name: start
        in: query
        required: false
        schema:
          type: integer
        example: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationAclsResponse'
              examples:
                3GetTheUserSOrganizationSCompanyPages:
                  summary: 3. Get the user's organization(s) (company pages)
