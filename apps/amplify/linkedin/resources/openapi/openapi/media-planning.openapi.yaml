      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - forecastReaches
          - forecastImpressions
        description: Rest.li action name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMediaPlanningRequest'
            examples:
              forecastReachCurve:
                summary: Forecast Reach Curve
                value:
                  request:
                    sponsoredAccountUrn: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                    targetingCriteria:
                      include:
                        and:
                        - or:
                            urn:li:adTargetingFacet:ageRanges:
                            - urn:li:ageRange:(18,24)
                        - or:
                            urn:li:adTargetingFacet:locations:
                            - urn:li:geo:103644278
                    targetBudgetMicros: 300000000
                    optimizationType: MAX_REACH
                    objectiveType: BRAND_AWARENESS
                    enableAudienceExpansion: true
                    enableAudienceNetwork: true
                    startDateOn:
                      day: 1
                      month: 4
                      year: 2024
                    endDateOn:
                      day: 1
                      month: 5
                      year: 2024
