components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: LinkedIn OAuth 2.0 access token.
  parameters:
    LinkedInVersion:
      name: LinkedIn-Version
      in: header
      required: true
      description: API version in YYYYMM format (e.g. `202509`).
      schema:
        type: string
        pattern: ^[0-9]{6}$
    RestliProtocolVersion:
      name: X-Restli-Protocol-Version
      in: header
      required: false
      schema:
        type: string
        enum:
        - 2.0.0
        default: 2.0.0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        serviceErrorCode:
          type: integer
        message:
          type: string
    Elements:
      type: object
      properties:
        creator:
          type: string
        targetBudgetMicros:
          type: integer
        enableAudienceNetwork:
          type: boolean
        targetingCriteria:
          type: object
          properties:
            include:
              type: object
              properties:
                and:
                  type: array
                  items:
                    type: object
                    properties:
                      or:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
        endDateOn:
          type: object
          properties:
            month:
              type: integer
            year:
              type: integer
            day:
              type: integer
        ctvOnly:
          type: boolean
        startDateOn:
          type: object
          properties:
            month:
              type: integer
            year:
              type: integer
            day:
              type: integer
        objectiveType:
          type: string
        createdAt:
          type: integer
          format: int64
        reachCurve:
          type: object
          properties:
            metricCurve:
              type: array
              items:
                type: object
                properties:
                  metricUpper:
                    type: number
                  metricValue:
                    type: number
                  budgetMicros:
                    type: integer
                    format: int64
                  metricLower:
                    type: number
            singlePointMetric:
              type: object
              properties:
                metricUpper:
                  type: number
                metricValue:
                  type: number
                budgetMicros:
                  type: integer
                metricLower:
                  type: number
        enableAudienceExpansion:
          type: boolean
        optimizationType:
          type: string
        name:
