        - **Forecast Reach Curve** (`action=forecastReaches`)

        - **Forecast Reach Percentage Curve** (`action=forecastReaches`)

        - **Forecast Impression Curve** (`action=forecastImpressions`)

        - **Forecast Avg Lifetime Frequency** (`action=forecastImpressions`)'
