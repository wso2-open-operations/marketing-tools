openapi: 3.0.3
info:
  title: Media Planning
  version: 1.0.0
  description: "## Overview\n\nMedia Planning API can help Media Planners understand the reach and ROI that LinkedIn\
    \ can offer to their client. It allows them to make budget allocation recommendations with confidence and know\
    \ how to improve the results, even before spending the first dollar. Media Planning API helps Media Planners\
    \ make that decision by giving the forecasted reach, impressions (and more in future, like clicks, leads) curve\
    \ over the budget, based on inputs provided like targeted audience, campaign start/end date and more.\n\nNote:\
    \ This is a private API that is available to qualified developers who meet additional criteria for access. To\
    \ learn more about eligibility qualifications and how to request access, please see the [FAQ](https://learn.microsoft.com/en-us/linkedin/marketing/lms-faq#how-do-i-get-access-to-media-planning-api-product).\
    \ If you wish to apply for access, please submit a [Zendesk support ticket](https://linkedin.zendesk.com/).\n\
    \n## Permissions\n\nMedia Planning API requires a [3-legged OAuth](https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow)\
    \ member token and your developer application needs to be provisioned with the Media Planning API product. Once\
    \ you have been approved to access, you can use any valid member access token associated with the authenticated\
    \ user with any valid scope permissions for member authentication. If there is no valid member token for the\
    \ relevant user from any previous integration, we recommend using the bare minimum scope permissions like `r_ads`\
    \ which will be required to fetch authenticated user's ad accounts.  \nNote: This API is application-specific;\
    \ hence, explicit member consent is not required. Any valid member access token associated with the authenticated\
    \ user can be used, and you do not need to add any additional permission in the scope of your Oauth2 flow for\
    \ authorization.\n\nThis collection aims to focus on different Media Planning use cases and should be used with\
    \ the **media-planning-env-versioning** environment.\n\n\\--All requests for the Media Planning API collection\
    \ are in the Restli 2.0 format--\n\n_Generated from the Postman collection \"Media Planning\". All calls use\
    \ Rest.li 2.0 conventions: send `X-Restli-Protocol-Version: 2.0.0` and a `LinkedIn-Version` header (YYYYMM).\
    \ Query parameters such as `List(...)`, `(a:b,c:d)` and URNs are Rest.li-encoded strings; do not re-encode the\
    \ structural characters `( ) , :`. Several finders/actions share one path in LinkedIn's API, so they are modelled\
    \ as one operation with a `q`/`action` selector. Schemas are inferred from the example payloads saved in the\
    \ collection: every field is optional and field semantics are not documented here._"
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- bearerAuth: []
tags:
- name: Ad Targeting Entities
- name: Forecast Media Plans
- name: Manage Media Plans
paths:
  /adTargetingFacets:
    get:
      operationId: getAListOfAvailableAdTargetingFacets
      summary: Get a list of available Ad Targeting Facets
      tags:
      - Ad Targeting Entities
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAListOfAvailableAdTargetingFacetsResponse'
              examples:
                getAListOfAvailableAdTargetingFacets:
                  summary: Get a list of available Ad Targeting Facets
                  value:
                    paging:
                      start: 0
                      count: 10
                      links: []
                    elements:
                    - entityTypes:
                      - FUNCTION
                      facetName: jobFunctions
                      $URN: urn:li:adTargetingFacet:jobFunctions
                      availableEntityFinders:
                      - AD_TARGETING_FACET
                    - entityTypes:
                      - AGE
                      facetName: ageRanges
                      $URN: urn:li:adTargetingFacet:ageRanges
                      availableEntityFinders:
                      - AD_TARGETING_FACET
        default:
          $ref: '#/components/responses/Error'
  /adTargetingEntities:
    get:
      operationId: getAdTargetingEntities
      summary: Query adTargetingEntities
      tags:
      - Ad Targeting Entities
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Get all seniorities** (`q=adTargetingFacet`)

        - **Get all job functions** (`q=adTargetingFacet`)

        - **Get all job titles (paginated)** (`q=adTargetingFacet`)

        - **Get all skills (paginated)** (`q=adTargetingFacet`)

        - **Get all interests** (`q=adTargetingFacet`)

        - **Get all member behaviors** (`q=adTargetingFacet`)

        - **Get all yearsOfExperience ranges** (`q=adTargetingFacet`)

        - **Get all age ranges** (`q=adTargetingFacet`)

        - **Get all industries** (`q=adTargetingFacet`)

        - **Get all company revenue categories** (`q=adTargetingFacet`)

        - **Get all company ranking list categories** (`q=adTargetingFacet`)

        - **Get all company growth rate categories** (`q=adTargetingFacet`)

        - **Get all company staff count categories** (`q=adTargetingFacet`)

        - **Get Bing Geo locations using search typeahead** (`q=typeahead`)'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - adTargetingFacet
          - typeahead
        description: Rest.li finder name. Selects which query this call performs.
      - name: queryVersion
        in: query
        required: false
        schema:
          type: string
        example: QUERY_USES_URNS
      - name: facet
        in: query
        required: false
        schema:
          type: string
        example: urn:li:adTargetingFacet:seniorities
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: name,urn
        allowReserved: true
      - name: start
        in: query
        required: false
        schema:
          type: integer
        example: 0
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 1000
      - name: totals
        in: query
        required: false
        schema:
          type: boolean
        example: false
      - name: query
        in: query
        required: false
        schema:
          type: string
        example: united states
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdTargetingEntitiesResponse'
              examples:
                getAllSeniorities:
                  summary: Get all seniorities
                  value:
                    paging:
                      start: 0
                      count: 2147483647
                      links: []
                      total: 10
                    elements:
                    - name: Unpaid
                      urn: urn:li:seniority:1
                    - name: Training
                      urn: urn:li:seniority:2
                getAllJobFunctions:
                  summary: Get all job functions
                  value:
                    paging:
                      start: 0
                      count: 2147483647
                      links: []
                      total: 26
                    elements:
                    - name: Accounting
                      urn: urn:li:function:1
                    - name: Administrative
                      urn: urn:li:function:2
                getAllJobTitlesPaginated:
                  summary: Get all job titles (paginated)
                  value:
                    paging:
                      start: 0
                      count: 1000
                      links:
                      - type: application/json
                        rel: next
                        href: /rest/adTargetingEntities?q=adTargetingFacet&start=1000&count=1000&totals=false&fields=urn,name&facet=urn%3Ali%3AadTargetingFacet%3Atitles&queryVersion=QUERY_USES_URNS
                    elements:
                    - name: Owner
                      urn: urn:li:title:1
                    - name: Manager
                      urn: urn:li:title:2
        default:
          $ref: '#/components/responses/Error'
  /mediaPlanning:
