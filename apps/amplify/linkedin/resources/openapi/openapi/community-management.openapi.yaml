openapi: 3.0.3
info:
  title: Community Management
  version: 1.0.0
  description: '**You must apply for access to the Marketing Developer Platform in order to use these APIs. See
    the** [**Developer Portal**](https://developer.linkedin.com/product-catalog/marketing/page-management) **on
    how to apply.**


    This collection aims to focus on different Community Management use cases, for example, social action notifications,
    and should be used with the **community-management-env-versioning** environment.


    \--All requests for the Community Management API collection are in the Restli 2.0 format--


    AuthorizationOAuth 2.0


    _Generated from the Postman collection "Community Management". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - rw_organization_admin
  - w_organization_social
  - r_basicprofile
  - r_organization_social
  - r_organization_social_feed
  - r_organization_followers
tags:
- name: Use Cases
paths:
  /shares:
    post:
      operationId: postShares
      summary: Create / update / action on shares
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **2. Create a share with Company Mention**: Mention a company name by using the annotations. [Learn more](https://docs.microsoft.com/en-us/linkedin/marketing/integrations/community-management/shares/share-api?tabs=http#share-text-and-mentions)
        by viewing our public documentation.

        - **2. Create a share with a Company Mention**: Mention a company name by using the annotations. [Learn
        more](https://docs.microsoft.com/en-us/linkedin/marketing/integrations/community-management/shares/share-api?tabs=http#share-text-and-mentions) by
        viewing our public documentation.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSharesRequest'
            examples:
              2CreateAShareWithCompanyMention:
                summary: 2. Create a share with Company Mention
                value:
                  owner: urn:li:organization:{{organization_id}}
                  text:
                    annotations:
                    - entity: urn:li:organization:1337
                      length: 8
                      start: 6
                    text: Hello LinkedIn world Project 2B testing!
                  subject: Test Share Subject  Project 2B testing
                  distribution:
                    linkedInDistributionTarget: {}
                  content:
                    contentEntities:
                    - entityLocation: https://www.example.com
                      thumbnails:
                      - resolvedUrl: https://www.example.com/image.jpg
                    title: Test Share with Content title  Project 2B testing
              2CreateAShareWithACompanyMention:
                summary: 2. Create a share with a Company Mention
                value:
                  owner: urn:li:organization:{{organization_id}}
                  text:
                    annotations:
                    - entity: urn:li:organization:1337
                      length: 8
                      start: 6
                    text: Hello LinkedIn world!
                  subject: Test Share Subject
                  distribution:
                    linkedInDistributionTarget: {}
                  content:
                    contentEntities:
                    - entityLocation: https://www.example.com
                      thumbnails:
                      - resolvedUrl: https://www.example.com/image.jpg
                    title: Test Share with Content title
      responses:
        '201':
          description: Success (inferred — the source collection has no saved example for this call)
          headers:
            x-restli-id:
              schema:
                type: string
              description: Id (or URN) of the created resource.
        default:
          $ref: '#/components/responses/Error'
  /eventSubscriptions/{eventSubscriptionKey}:
    put:
      operationId: 3CreateASubscriptionRequest
      summary: 3. Create a subscription request
      tags:
      - Use Cases
      description: '[Create a subscription](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-social-action-notifications?tabs=http#creating-and-updating-subscriptions) record
        to include the webhook URL where your app will receive notifications. The subscription request will only
        succeed if the subscribing member is an administrator of the organization being subscribed to.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: eventSubscriptionKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook:
                  type: string
            examples:
              3CreateASubscriptionRequest:
                summary: 3. Create a subscription request
                value:
                  webhook: https://www.example.com/callback
      responses:
        '201':
          description: Success (inferred — the source collection has no saved example for this call)
          headers:
            x-restli-id:
              schema:
                type: string
              description: Id (or URN) of the created resource.
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: 5RetrieveSubscriptionByKey
      summary: 5. Retrieve Subscription by Key
      tags:
      - Use Cases
      description: Retrieve all the subscriptions details such as webhook url and expiration for the logged in user. [Learn
        more](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-social-action-notifications?tabs=http#retrieve-subscriptions-for-an-authenticated-member) by
        viewing our online documentation.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: eventSubscriptionKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: 6RemoveASubscription
      summary: 6. Remove a Subscription
      tags:
      - Use Cases
      description: '[Remove a subscription](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-social-action-notifications?tabs=http#remove-a-subscription) for
        a your developer application and Organization.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: eventSubscriptionKey
        in: path
        required: true
        description: Composite Rest.li key, e.g. `(a:urn%3A...,b:urn%3A...)`.
        schema:
          type: string
      responses:
        '204':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /eventSubscriptions:
    get:
      operationId: getEventSubscriptions
      summary: Query eventSubscriptions
      tags:
      - Use Cases
      description: "This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`\
        \ / body shape). Variants seen in the source collection:\n- **4. Retrieve subscription for authenticated\
        \ members** (`q=subscriberAndEventType`): Retrieve Subscriptions details such as webhook url and expiration\
        \ for your application and registered user. [Learn more](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-social-action-notifications?tabs=http#retrieve-subscriptions-by-key) by\
        \ \n- **3. Retrieve Notifications for the authenticated member's organization** (`q=subscriberAndEventType`):\
        \ [Learn more](https://docs.microsoft.com/linkedin/marketing/integrations/community-management/organizations/organization-social-action-notifications?tabs=http#pull-organizational-notifications) by\
        \ viewing our public documentation."
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - subscriberAndEventType
        description: Rest.li finder name. Selects which query this call performs.
      - name: eventType
        in: query
        required: false
        schema:
          type: string
        example: ORGANIZATION_SOCIAL_ACTION_NOTIFICATIONS
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
