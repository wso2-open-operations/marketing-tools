        - **Time-Bound follower statistics** (`q=organizationalEntity`)

        - **Lifetime Follower Statistics** (`q=organizationalEntity`): Retrieves lifetime follower statistics segmented
        by professional demographic facets (association type, geo, geo country, function, industry, seniority, staff
        count range). Omitting `timeIntervals` returns segmented lifetime stats. See https://learn.microsoft.com/en-us/linkedin/marketing/community-ma

        - **Time-Bound Follower Statistics** (`q=organizationalEntity`): Retrieves time-bound (aggregate, non-segmented)
        follower statistics for the given time range and granularity (DAY, WEEK, or MONTH). Provides data from 12
        months before the request date through 2 days before the request date. Update follower_stats_time_range_start/end
        env vars (epoch ms) as needed. S'
