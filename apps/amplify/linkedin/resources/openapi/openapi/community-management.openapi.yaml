  /organizationalEntityShareStatistics:
    get:
      operationId: getOrganizationalEntityShareStatistics
      summary: Query organizationalEntityShareStatistics
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Lifetime Share Statistics** (`q=organizationalEntity`)

        - **Time Bound Share Statistics** (`q=organizationalEntity`)

        - **Lifetime Share Statistics** (`q=organizationalEntity`): Retrieves lifetime (aggregate) organic share
        statistics for the organization. Omitting `timeIntervals` returns lifetime stats (totalShareStatistics).
        Does not support pagination. See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/organizations/share-statistics

        - **Time-Bound Share Statistics** (`q=organizationalEntity`): Retrieves aggregate organic share statistics
        within the given time range/granularity (DAY or MONTH), from a rolling 12-month window. Update share_stats_time_range_start/end
        env vars (epoch ms) as needed. See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/organizations/shar

        - **Share Statistics for Specific Shares** (`q=organizationalEntity`): Retrieves lifetime share statistics
        for specific organization share URNs (share_id, share_id2 env vars). Time-bound statistics is not supported
        for specific share queries. Shares with no actions/impressions are omitted from the response. See https://learn.microsoft.com/en-us/linkedin/marketing/commu

        - **Share Statistics for Specific UGC Posts** (`q=organizationalEntity`): Retrieves lifetime share statistics
        for specific UGC Post URNs (ugc_post_id, ugc_post_id2 env vars). Time-bound statistics is not supported
        for specific UGC Post queries. Posts with no actions/impressions are omitted from the response. See https://learn.microsoft.com/en-us/linkedin/marketing/communi'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - organizationalEntity
        description: Rest.li finder name. Selects which query this call performs.
      - name: organizationalEntity
        in: query
        required: false
        schema:
          type: string
        example: urn:li:organization:2414183
      - name: timeIntervals.timeGranularityType
        in: query
        required: false
        schema:
          type: string
        example: DAY
      - name: timeIntervals.timeRange.start
        in: query
        required: false
        schema:
          type: string
        example: '1634018799000'
      - name: timeIntervals.timeRange.end
        in: query
        required: false
        schema:
          type: string
        example: '1634623599000'
      - name: timeIntervals
        in: query
        required: false
        schema:
          type: string
      - name: shares
        in: query
        required: false
        schema:
          type: string
      - name: ugcPosts[0]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
