  /socialActions/{socialActionUrn}/comments:
    get:
      operationId: getSocialActionsComments
      summary: Query comments
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Batch Get a Collection of Comments**: Batch retrieves multiple comments by ID on the same thread (share/ugcPost/comment
        URN). See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/shares/comments-api

        - **Get Comments on a Share**: Retrieves all top-level comments on a given share/ugcPost (thread URN). See
        https://learn.microsoft.com/en-us/linkedin/marketing/community-management/shares/comments-api

        - **Get Comments on a Comment (Nested)**: Resolves nested (reply) comments for a given parent commentUrn
        (composite URN of thread activityUrn + comment ID). See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/shares/comments-api'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: socialActionUrn
        in: path
        required: true
        description: URN of the resource (URL-encoded).
        schema:
          type: string
      - name: ids
        in: query
        required: false
        schema:
          type: string
        description: Batch ids in Rest.li 2.0 list syntax, e.g. `List(id1,id2)`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSocialActionsCommentsResponse'
              examples:
                getCommentsOnAShare:
                  summary: Get Comments on a Share
                  value:
                    paging:
                      start: 0
                      count: 10
                      links: []
                      total: 1
                    elements:
                    - actor: urn:li:organization:2414183
                      agent: urn:li:person:bB4Pmsd_uL
                      commentUrn: urn:li:comment:(urn:li:ugcPost:7508595577971105792,7508993488256962561)
                      created:
                        actor: urn:li:organization:2414183
                        impersonator: urn:li:person:bB4Pmsd_uL
                        time: 1790283557954
                      id: '7508993488256962561'
                      lastModified:
                        actor: urn:li:organization:2414183
                        impersonator: urn:li:person:bB4Pmsd_uL
                        time: 1790283557954
                      message:
                        attributes: []
                        text: A sample text comment
                      object: urn:li:ugcPost:7508595577971105792
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: postSocialActionsComments
      summary: Create / update / action on comments
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Create a Comment**: Creates a top-level comment on a share/ugcPost (thread). Returns the new comment
        ID in the x-restli-id response header. See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/shares/comments-api

        - **Create a Comment on a Comment (Nested)**: Creates a nested (reply) comment by including the parentComment
        field (composite URN of thread activityUrn + parent comment ID). See https://learn.microsoft.com/en-us/linkedin/marketing/community-management/shares/comments-api'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: socialActionUrn
        in: path
        required: true
        description: URN of the resource (URL-encoded).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSocialActionsCommentsRequest'
            examples:
              createAComment:
                summary: Create a Comment
                value:
                  actor: urn:li:organization:{{organization_id}}
                  object: urn:li:ugcPost:{{ugc_post_id}}
                  message:
                    text: '{{comment_message_text}}'
              createACommentOnACommentNested:
