openapi: 3.0.3
info:
  title: Company Intelligence API
  version: 1.0.0
  description: '_Generated from the Postman collection "Company Intelligence API". All calls use Rest.li 2.0 conventions:
    send `X-Restli-Protocol-Version: 2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`,
    `(a:b,c:d)` and URNs are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several
    finders/actions share one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action`
    selector. Schemas are inferred from the example payloads saved in the collection: every field is optional and
    field semantics are not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- bearerAuth: []
tags:
- name: Company Intelligence API
paths:
  /adAccountUsers:
    get:
      operationId: fetchAllAdAccountsOfTheAuthenticatedUser
      summary: Fetch all ad accounts of the authenticated user
      tags:
      - Company Intelligence API
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - authenticatedUser
        description: Rest.li finder name. Selects which query this call performs.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchAllAdAccountsOfTheAuthenticatedUserResponse'
              examples:
                fetchAllAdAccountsOfTheAuthenticatedUser:
                  summary: Fetch all ad accounts of the authenticated user
                  value:
                    elements:
                    - account: urn:li:sponsoredAccount:516413367
                      changeAuditStamps:
                        created:
                          actor: urn:li:unknown:0
                          time: 1500331577000
                        lastModified:
                          actor: urn:li:unknown:0
                          time: 1505328748000
                      role: ACCOUNT_BILLING_ADMIN
                      user: urn:li:person:K1RwyVNukt
                      version:
                        versionTag: '89'
                    - account: urn:li:sponsoredAccount:516880883
                      changeAuditStamps:
                        created:
                          actor: urn:li:unknown:0
                          time: 1505326590000
                        lastModified:
                          actor: urn:li:unknown:0
                          time: 1505326615000
                      role: ACCOUNT_BILLING_ADMIN
                      user: urn:li:person:K1RwyVNukt
                      version:
                        versionTag: '3'
                    paging:
                      count: 2
                      links: []
                      start: 0
                      total: 2
        default:
          $ref: '#/components/responses/Error'
  /adAccounts/{adAccountId}/adCampaigns:
    get:
      operationId: searchForCampaignsUsingSearchCriteria
      summary: Search for campaigns using search criteria
      tags:
      - Company Intelligence API
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: adAccountId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - search
        description: Rest.li finder name. Selects which query this call performs.
      - name: search.campaignGroup.values[0]
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchForCampaignsUsingSearchCriteriaResponse'
              examples:
                searchForCampaignsUsingSearchCriteria:
                  summary: Search for campaigns using search criteria
                  value:
                    elements:
                    - targetingCriteria:
                        include:
                          and:
                          - or:
                              urn:li:adTargetingFacet:employers:
                              - urn:li:company:1035
                          - or:
                              urn:li:adTargetingFacet:locations:
                              - urn:li:geo:103644278
                      servingStatuses:
                      - ACCOUNT_SERVING_HOLD
                      type: SPONSORED_UPDATES
                      locale:
                        country: US
                        language: en
                      version:
                        versionTag: '1'
                      associatedEntity: urn:li:organization:2414183
                      test: false
                      runSchedule:
                        end: 9876543210123
                        start: 1234567890987
                      targeting:
                        includedTargetingFacets:
                          employers:
                          - urn:li:organization:1035
                          locations:
                          - urn:li:geo:103644278
                          interfaceLocales:
                          - country: US
                            language: en
                      optimizationPreference:
                        frequencyOptimizationPreference:
                          timeSpan:
                            duration: 7
                            unit: DAY
                          optimizationType: MAX_FREQUENCY
                          frequency: 10
                      optimizationTargetType: NONE
                      changeAuditStamps:
                        created:
                          time: 1543365082000
                        lastModified:
                          time: 1543365082000
                      campaignGroup: urn:li:sponsoredCampaignGroup:603030884
                      dailyBudget:
                        amount: '18'
                        currencyCode: USD
                      unitCost:
                        amount: '15'
                        currencyCode: USD
                      creativeSelection: OPTIMIZED
                      costType: CPC
                      name: Campaign Sponsored update B
                      offsiteDeliveryEnabled: false
                      id: 145282384
                      audienceExpansionEnabled: false
                      account: urn:li:sponsoredAccount:506333826
                      status: ACTIVE
                    metadata:
                      nextPageToken: DgGerr1iVQreCJVjZDOW_grcp63nueBDipsS4DJpvJo
        default:
          $ref: '#/components/responses/Error'
  /adSegments:
    get:
      operationId: fetchExistingAdSegmentsBasedOnAdAccount
