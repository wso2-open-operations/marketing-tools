  /accountIntelligence:
    get:
      operationId: getAccountIntelligence
      summary: Query accountIntelligence
      tags:
      - Company Intelligence API
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **Fetch account intelligence data using lookback window filter** (`q=account`)

        - **Fetch account intelligence data using ad segment filter** (`q=account`)

        - **Fetch account intelligence data using campaign filter** (`q=account`)'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - account
        description: Rest.li finder name. Selects which query this call performs.
      - name: start
        in: query
        required: false
        schema:
          type: integer
        example: 0
      - name: count
        in: query
        required: false
        schema:
          type: integer
        example: 10
      - name: account
        in: query
        required: false
        schema:
          type: string
      - name: filterCriteria
        in: query
        required: false
        schema:
          type: string
        example: (lookbackWindow:LAST_7_DAYS)
        allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountIntelligenceResponse'
              examples:
                fetchAccountIntelligenceDataUsingLookbackWindowFilter:
                  summary: Fetch account intelligence data using lookback window filter
                  value:
                    elements:
                    - companyPageUrl: https://www.linkedin.com/company/microsoft
                      companyWebsite: http://www.microsoft.com
                      paidClicks: 20
                      organicEngagements: 50
                      companyName: Microsoft
                      paidLeads: 40
                      paidEngagements: 300
                      paidImpressions: 133
                      organicImpressions: 50
                      engagementLevel: VERY_LOW
                    paging:
                      count: 10
                      start: 0
                      total: 30
                      links:
                      - rel: next
                        type: application/json
                        href: /partnerApiAccountIntelligence?q=account&filterCriteria=(lookbackWindow:LAST_7_DAYS,adSegments:List())&start=10&count=10&account=urn%3Ali%3AsponsoredAccount%3A123456789
                fetchAccountIntelligenceDataUsingAdSegmentFilter:
                  summary: Fetch account intelligence data using ad segment filter
                  value:
                    elements:
                    - companyPageUrl: https://www.linkedin.com/company/microsoft
                      companyWebsite: http://www.microsoft.com
                      paidClicks: 20
                      organicEngagements: 50
                      companyName: Microsoft
                      paidLeads: 40
                      paidEngagements: 300
                      paidImpressions: 133
                      organicImpressions: 50
                      engagementLevel: VERY_LOW
                    paging:
                      count: 10
                      start: 0
                      total: 30
                      links:
                      - rel: next
                        type: application/json
                        href: /partnerApiAccountIntelligence?q=account&filterCriteria=(lookbackWindow:LAST_7_DAYS,adSegments:List())&start=10&count=10&account=urn%3Ali%3AsponsoredAccount%3A123456789
                fetchAccountIntelligenceDataUsingCampaignFilter:
                  summary: Fetch account intelligence data using campaign filter
                  value:
                    elements:
                    - companyPageUrl: https://www.linkedin.com/company/microsoft
                      companyWebsite: http://www.microsoft.com
                      paidClicks: 20
                      organicEngagements: 50
                      companyName: Microsoft
                      paidLeads: 40
                      paidEngagements: 300
                      paidImpressions: 133
                      organicImpressions: 50
                      engagementLevel: VERY_LOW
                    paging:
                      count: 10
                      start: 0
                      total: 30
                      links:
                      - rel: next
                        type: application/json
                        href: /partnerApiAccountIntelligence?q=account&filterCriteria=(lookbackWindow:LAST_7_DAYS,adSegments:List())&start=10&count=10&account=urn%3Ali%3AsponsoredAccount%3A123456789
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: LinkedIn OAuth 2.0 access token.
  parameters:
    LinkedInVersion:
      name: LinkedIn-Version
      in: header
      required: true
      description: API version in YYYYMM format (e.g. `202509`).
      schema:
        type: string
        pattern: ^[0-9]{6}$
    RestliProtocolVersion:
      name: X-Restli-Protocol-Version
      in: header
      required: false
      schema:
        type: string
        enum:
        - 2.0.0
        default: 2.0.0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        serviceErrorCode:
          type: integer
        message:
          type: string
