        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    linkedinOAuth2:
      type: oauth2
      description: LinkedIn 3-legged OAuth 2.0 (authorization code).
      flows:
        authorizationCode:
          authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
          tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
          scopes:
            r_ads: LinkedIn permission `r_ads`
            r_ads_reporting: LinkedIn permission `r_ads_reporting`
            r_basicprofile: LinkedIn permission `r_basicprofile`
  parameters:
    LinkedInVersion:
      name: LinkedIn-Version
      in: header
      required: true
      description: API version in YYYYMM format (e.g. `202509`).
      schema:
        type: string
        pattern: ^[0-9]{6}$
    RestliProtocolVersion:
      name: X-Restli-Protocol-Version
      in: header
      required: false
      schema:
        type: string
        enum:
        - 2.0.0
        default: 2.0.0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        serviceErrorCode:
          type: integer
        message:
          type: string
    GetAdAnalyticsResponse:
      type: object
      properties:
        paging:
          type: object
          properties:
            start:
              type: integer
            count:
              type: integer
            links:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  rel:
                    type: string
                  href:
                    type: string
        elements:
          type: array
          items:
            type: object
            properties:
              externalWebsitePostClickConversions:
                type: integer
              shares:
                type: integer
              pivot:
                type: string
              pivotValues~:
                type: array
                items:
                  type: object
                  nullable: true
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    campaignGroup:
                      type: string
                    campaignGroup~:
                      type: object
                      properties:
                        name:
                          type: string
                        id:
                          type: integer
                        status:
                          type: string
                    name:
                      oneOf:
                      - type: string
                      - type: object
                        properties:
                          localized:
                            type: object
                            properties:
                              en_US:
                                type: string
                      - type: string
                    id:
                      type: integer
                    objectiveType:
                      type: string
              pivotValue:
                type: string
              comments:
                type: integer
              externalWebsitePostViewConversions:
                type: integer
              oneClickLeads:
                type: integer
              conversionValueInLocalCurrency:
                type: string
              impressions:
                type: integer
              externalWebsiteConversions:
                type: integer
              clicks:
                type: integer
              totalEngagements:
                type: integer
              reactions:
                type: integer
              pivotValues:
                type: array
                items:
                  type: string
              approximateUniqueImpressions:
                type: integer
              pivotValue~:
                type: object
                properties:
                  variables:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          com.linkedin.ads.SponsoredVideoCreativeVariables:
                            type: object
                            properties:
                              mediaAsset~:
                                type: object
                                properties:
                                  paging:
                                    type: object
                                    properties:
                                      count:
                                        type: integer
                                      start:
                                        type: integer
                                      links:
                                        type: array
                                        items: {}
                                  elements:
                                    type: array
                                    items: {}
                              videoAspectRatio:
                                type: object
                                properties:
                                  widthAspect:
                                    type: integer
                                  heightAspect:
                                    type: number
                              mediaAsset:
                                type: string
                              userGeneratedContentPost:
                                type: string
                              directSponsoredContent:
                                type: boolean
                              durationMicro:
                                type: integer
                  vanityName:
                    type: string
                  localizedName:
                    type: string
                  localizedWebsite:
                    type: string
              likes:
                type: integer
              landingPageClicks:
                type: integer
              follows:
                type: integer
              dateRange:
                type: object
                properties:
                  start:
                    type: object
                    properties:
                      month:
                        type: integer
                      year:
                        type: integer
                      day:
                        type: integer
                  end:
                    type: object
                    properties:
                      month:
                        type: integer
                      year:
                        type: integer
                      day:
                        type: integer
              videoCompletions:
                type: integer
              costInUsd:
                type: string
              costInLocalCurrency:
                type: string
              sends:
                type: integer
              opens:
                type: integer
              videoViews:
                type: integer
              revenueAttributionMetrics:
                type: object
                properties:
                  openOpportunities:
                    type: integer
                  returnOnAdSpend:
                    type: number
                  opportunityWinRate:
                    type: number
                  revenueWonInUsd:
                    type: string
                  closedWonOpportunities:
                    type: integer
                  averageDaysToClose:
                    type: number
                  opportunityAmountInUsd:
                    type: string
                  averageDealSizeInUsd:
                    type: string
              oneClickLeadFormOpens:
                type: integer
