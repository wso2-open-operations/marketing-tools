openapi: 3.0.3
info:
  title: Reporting & ROI
  version: 1.0.0
  description: '**You must apply for access to the LinkedIn Advertising APIs in order to gain access to these APIs.
    See the** [**Developer Platform**](https://developer.linkedin.com/product-catalog/marketing/reporting-and-roi)
    **on how to apply.**


    [LinkedIn''s Reporting & ROI APIs](https://learn.microsoft.com/en-us/linkedin/marketing/integrations/ads-reporting/getting-started)
    enable you to leverage LinkedIn marketing data to automate internal reporting and gain valuable insights. Partners
    can integrate LinkedIn data into their solutions to retrieve performance data, targeting information, audience
    insights, and much more.


    This collection aims to focus on different Reporting & ROI use cases and should be used with the **reporting-roi-env-versioning**
    environment.


    \--All requests for the Reporting & ROI API collection are in the Restli 2.0 format--


    AuthorizationOAuth 2.0


    _Generated from the Postman collection "Reporting & ROI". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - r_ads
  - r_ads_reporting
  - r_basicprofile
tags:
- name: Use Cases
paths:
  /adAnalytics:
    get:
      operationId: getAdAnalytics
      summary: Query adAnalytics
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **By Creative + Campaign with creative type,status & campaign name, type, status, campaign group projection**
        (`q=statistics`): This API slice the conversion and the campaign data against campaign name, type, status
        and campaign group projection.

        - **By Creative with content projection for different creative types** (`q=analytics`): This API slice the
        creative data against content projections for different creative types.

        - **By Member Industry with name projection** (`q=analytics`): This API pull the analytics data by slicing
        it through the member insdustry with name projection.

        - **By Conversion + Campaign with campaign name, type, status, campaign group projection** (`q=statistics`):
        This API slice the conversion and the campaign data against nme, type, status and campaign projection.

        - **By Member Company with name & website projection** (`q=analytics`): This API pull the analytics data
        by slicing it through the member company with name and website projection.

        - **Performance - by Objective** (`q=statistics`)

        - **Performance - by Campaign** (`q=analytics`)

        - **Performance - by Creative** (`q=analytics`)

        - **Performance - Dashboard Overview** (`q=analytics`)

        - **Demographics - Member Company** (`q=analytics`)

        - **Demographics - Member Funtion** (`q=analytics`)

        - **Demographics - Member Seniority** (`q=analytics`)

        - **Demographics - Member Title** (`q=analytics`)

        - **Account Performance Bundle** (`q=analytics`)

        - **Account Engagement Bundle** (`q=analytics`)

        - **Basic Conversion Type** (`q=statistics`)

        - **Conversions through Funnel** (`q=statistics`)

        - **Conversions by Member Company** (`q=analytics`)

        - **Conversions by Member Function** (`q=analytics`)

        - **Conversions by Member Seniority** (`q=analytics`)

        - **Conversions by Member Job Title** (`q=analytics`)

        - **Conversions by Member Industry** (`q=analytics`)

        - **Conversions by Member Company Size** (`q=analytics`)

        - **Revenue Metrics By Ad Account** (`q=attributedRevenueMetrics`)

        - **Ad Metrics By Ad Account** (`q=analytics`)

        - **Revenue Metrics By Ad Account + Campaign Group + Campaign** (`q=attributedRevenueMetrics`)

        - **Ad Metrics By Ad Account + Campaign Group + Campaign** (`q=statistics`)'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - statistics
          - analytics
          - attributedRevenueMetrics
        description: Rest.li finder name. Selects which query this call performs.
      - name: dateRange
        in: query
        required: false
        schema:
          type: string
        example: (start:(day:1,month:1,year:2023),end:(day:30,month:3,year:2023))
        allowReserved: true
      - name: timeGranularity
        in: query
        required: false
        schema:
          type: string
        example: ALL
        allowReserved: true
      - name: accounts
        in: query
        required: false
        schema:
          type: string
      - name: pivots
        in: query
        required: false
        schema:
          type: string
        example: List(CREATIVE,CAMPAIGN)
        allowReserved: true
      - name: fields
        in: query
        required: false
        schema:
          type: string
        example: impressions,clicks,totalEngagements,comments,shares,reactions,approximateUniqueImpressions,externalWebsiteConversions,externalWebsitePostClickConversions,externalWebsitePostViewConversions,conversionValueInLocalCurrency,oneClickLeads
        allowReserved: true
      - name: pivot
        in: query
        required: false
        schema:
          type: string
        example: CREATIVE
      - name: projection
        in: query
        required: false
        schema:
          type: string
        example: (*,elements*(*,approximateUniqueImpressions, pivotValue~(vanityName,localizedName,localizedWebsite)))
        allowReserved: true
      - name: account
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAdAnalyticsResponse'
              examples:
                byCreativeCampaignWithCreativeTypeStatusCampaignNameTypeStat:
                  summary: By Creative + Campaign with creative type,status & campaign name, type, status, campaign
                    group projection
                  value:
                    paging:
                      start: 0
                      count: 10
                      links: []
                    elements:
                    - externalWebsitePostClickConversions: 1
                      shares: 0
                      pivot: CREATIVE
                      pivotValues~:
                      - type: SPONSORED_VIDEO
                        status: ACTIVE
                      - campaignGroup: urn:li:sponsoredCampaignGroup:123
                        campaignGroup~:
                          name: Default Campaign Group
