        schema:
          type: string
          enum:
          - BATCH_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/3CreatePredictiveAudienceRequest'
            examples:
              3CreatePredictiveAudience:
                summary: 3.  Create Predictive Audience
                value:
                  targetingFilter:
                    include:
                      and:
