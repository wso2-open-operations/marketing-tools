openapi: 3.0.3
info:
  title: Audiences
  version: 1.0.0
  description: 'This collection aims to focus on different Audiences use cases and should be used with the **audiences-env-versioning**
    environment.


    \--All requests for the Audiences API collection are in the Restli 2.0 format--


    AuthorizationOAuth 2.0


    _Generated from the Postman collection "Audiences". All calls use Rest.li 2.0 conventions: send `X-Restli-Protocol-Version:
    2.0.0` and a `LinkedIn-Version` header (YYYYMM). Query parameters such as `List(...)`, `(a:b,c:d)` and URNs
    are Rest.li-encoded strings; do not re-encode the structural characters `( ) , :`. Several finders/actions share
    one path in LinkedIn''s API, so they are modelled as one operation with a `q`/`action` selector. Schemas are
    inferred from the example payloads saved in the collection: every field is optional and field semantics are
    not documented here._'
servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn REST API (`{{baseUrl}}` in the Postman environment)
security:
- linkedinOAuth2:
  - r_ads
  - rw_dmp_segments
  - r_basicprofile
tags:
- name: Use Cases
paths:
  /adAccounts:
