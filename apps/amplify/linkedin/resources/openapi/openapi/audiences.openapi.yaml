  /dmpSegments:
    get:
      operationId: getDmpSegments
      summary: Query dmpSegments
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **4. Fetch existing Audiences for chosen Ad Accounts** (`q=account`): The api call [fetches all DMP segments
        for a specific ad account](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#find-dmp-segments-by-account) and
        your designated sourcePlatform ENUM.

        - **8.  Monitor Status of the Company DMP Segments** (`q=account`): The api call [fetches all DMP segments
        for a specific ad account](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#find-dmp-segments-by-account) and
        your designated sourcePlatform ENUM.

        - **4. Fetch existing Audiences for the chosen Ad Account** (`q=account`): The api call [fetches all DMP
        segments for a specific ad account](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#find-dmp-segments-by-account) and
        your designated sourcePlatform ENUM.

        - **8. Monitor Status of the User DMP Segments** (`q=account`): The api call [fetches all DMP segments for
        a specific ad account](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#find-dmp-segments-by-account) and
        your designated sourcePlatform ENUM.

        - **8. Monitor Status of the List Upload DMP Segments** (`q=account`): The api call [fetches all DMP segments
        for a specific ad account](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#find-dmp-segments-by-account) that
        are List Upload segments.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - account
        description: Rest.li finder name. Selects which query this call performs.
      - name: account
        in: query
        required: false
        schema:
          type: string
      - name: sourcePlatform
        in: query
        required: false
        schema:
          type: string
        example: LIST_UPLOAD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDmpSegmentsResponse'
              examples:
