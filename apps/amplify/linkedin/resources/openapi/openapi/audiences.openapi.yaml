                      lastModified: 1634592751000
                      accessPolicy: PRIVATE
                      id: 9821736
                      type: COMPANY
                      account: urn:li:sponsoredAccount:123456
                      inputCount: 2
                8MonitorStatusOfTheCompanyDMPSegments:
                  summary: 8.  Monitor Status of the Company DMP Segments
                  value:
                    paging:
                      start: 0
                      count: 10
                      links: []
                      total: 2
                    elements:
                    - created: 1634519022000
                      destinations:
                      - audienceSize: 240000
                        destinationSegmentId: urn:li:adSegment:8596576
                        created: 1634519022000
                        destination: LINKEDIN
                        matchedCount: 2
                        lastModified: 1637219449000
                        status: READY
                      name: DMP Segment 1
                      sourcePlatform: FAKE
                      accessPolicy: PRIVATE
                      id: 9821736
                      lastModified: 1634592751000
                      type: COMPANY
                      account: urn:li:sponsoredAccount:123456
                      inputCount: 2
                    - created: 1683068124000
                      destinations:
                      - destination: LINKEDIN
                        lastModified: 1683068124000
                        destinationSegmentId: urn:li:adSegment:15326243
                        created: 1683068124000
                        status: BUILDING
                      name: Company DMP Segment
                      sourcePlatform: FAKE
                      accessPolicy: PRIVATE
                      id: 17667093
                      lastModified: 1683068124000
                      type: COMPANY
                      account: urn:li:sponsoredAccount:123546
                4FetchExistingAudiencesForTheChosenAdAccount:
                  summary: 4. Fetch existing Audiences for the chosen Ad Account
                  value:
                    paging:
                      start: 0
                      count: 10
                      links: []
                      total: 1
                    elements:
                    - created: 1634519022000
                      destinations:
                      - audienceSize: 240000
                        created: 1634519022000
                        destinationSegmentId: urn:li:adSegment:9896577
                        destination: LINKEDIN
                        matchedCount: 2
