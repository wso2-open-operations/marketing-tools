    post:
      operationId: postDmpSegments
      summary: Create / update / action on dmpSegments
      tags:
      - Use Cases
      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **6. Create a Company DMP Segment**: This call [creates a DMP segment](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#create-dmp-segment) named "DMP
        Segment 1" tied to the sponsored account the user chose in step 2.

        - **6. Create a User DMP segment (skip this step if the user chose to update an existing Audience)**: This
        call [creates a DMP segment](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#create-dmp-segment) named "DMP
        Segment 2" for users to be streamed to.

        - **2. Create a Predictive Audience DMP Segment**: This call [creates a DMP segment](https://docs.microsoft.com/linkedin/marketing/integrations/matched-audiences/create-and-manage-segments?tabs=http#create-dmp-segment)
        named "DMP Segment 1" tied to the sponsored account the user chose in step 2.

        - **6. Create list upload DMP Segment**: Here we create the CSV List Upload DMP segment. See our [online
        documentation](https://learn.microsoft.com/en-us/linkedin/marketing/integrations/matched-audiences/create-and-manage-list-uploads?tabs=http#sample-request-1)
        for more information.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDmpSegmentsRequest'
            examples:
              6CreateACompanyDMPSegment:
                summary: 6. Create a Company DMP Segment
                value:
                  name: Company DMP Segment
                  sourcePlatform: '{{dmp_partner_platform_enum}}'
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  type: COMPANY
                  destinations:
                  - destination: LINKEDIN
              6CreateAUserDMPSegmentSkipThisStepIfTheUserChoseToUpdateAnEx:
                summary: 6. Create a User DMP segment (skip this step if the user chose to update an existing Audience)
                value:
                  name: User DMP Segment
                  sourcePlatform: '{{dmp_partner_platform_enum}}'
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  type: USER
                  destinations:
                  - destination: LINKEDIN
              2CreateAPredictiveAudienceDMPSegment:
                summary: 2. Create a Predictive Audience DMP Segment
                value:
                  name: Company DMP Segment
                  sourcePlatform: LINKEDIN_BUSINESS_OBJECTIVE_BASED_AUDIENCES
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  type: COMPANY
                  destinations:
                  - destination: LINKEDIN
              6CreateListUploadDMPSegment:
                summary: 6. Create list upload DMP Segment
                value:
                  account: urn:li:sponsoredAccount:{{sponsoredaccount_id}}
                  destinations:
                  - destination: LINKEDIN
                  name: DMP segment for CSV uploads
                  sourcePlatform: LIST_UPLOAD
                  type: COMPANY_LIST_UPLOAD
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource.
            x-restli-id:
              schema:
                type: string
              description: Id (or URN) of the created resource.
            ETag:
              schema:
                type: string
              description: Entity tag.
        default:
          $ref: '#/components/responses/Error'
  /dmpSegments/{dmpSegmentId}/companies:
    post:
      operationId: 7StreamCompanyDataAddOrRemoveMultipleCompanies
