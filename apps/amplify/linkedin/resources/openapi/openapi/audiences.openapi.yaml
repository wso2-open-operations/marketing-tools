      description: 'This operation covers several related calls (distinguished by the `q` finder / `action` / `X-RestLi-Method`
        / body shape). Variants seen in the source collection:

        - **2. Retrieve the user''s Ad Accounts (sponsoredAccount)** (`q=search`)

        - **2. Retrieve the user''s Ad Accounts (sponsoredAccount)** (`q=search`): View [Search for Accounts](https://docs.microsoft.com/en-us/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#search-for-accounts) documentation
        for more information.

        - **1. Retrieve the user''s Ad Accounts (sponsoredAccount)** (`q=search`)

        - **2. Retrieve the user''s Ad Accounts (sponsoredAccount)** (`q=search`): View [Search for Accounts](https://docs.microsoft.com/en-us/linkedin/marketing/integrations/ads/account-structure/create-and-manage-accounts?tabs=http#search-for-accounts)
        documentation for more information.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - search
        description: Rest.li finder name. Selects which query this call performs.
      - name: search
        in: query
        required: false
        schema:
          type: string
        example: (type:(values:List(BUSINESS)),status:(values:List(ACTIVE)),test:false)
        allowReserved: true
      - name: fields
