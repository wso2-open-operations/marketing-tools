        our online documentation.


        The more information on a company that is provided, the better chance of a higher match rate.'
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: dmpSegmentId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      - name: X-RestLi-Method
        in: header
        required: false
        description: Rest.li method override used for batch / partial-update style calls.
        schema:
          type: string
          enum:
          - BATCH_CREATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/7StreamCompanyDataAddOrRemoveMultipleCompaniesRequest'
            examples:
              7StreamCompanyDataAddOrRemoveMultipleCompanies:
                summary: 7.  Stream company data - add or remove multiple companies
                value:
                  elements:
                  - action: ADD
                    companyName: LinkedIn
                  - action: ADD
                    companyName: Microsoft
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/7StreamCompanyDataAddOrRemoveMultipleCompaniesResponse'
              examples:
                7StreamCompanyDataAddOrRemoveMultipleCompanies:
                  summary: 7.  Stream company data - add or remove multiple companies
                  value:
                    elements:
                    - status: 201
                    - status: 201
        default:
          $ref: '#/components/responses/Error'
  /dmpSegments/{dmpSegmentId}/users:
    post:
