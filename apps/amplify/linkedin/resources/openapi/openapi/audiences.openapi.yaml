      tags:
      - Use Cases
      description: This example created a predictive audience within the DMP segment created in step 2.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: dmpSegmentId
        in: path
        required: true
