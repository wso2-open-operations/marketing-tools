components:
  securitySchemes:
    linkedinOAuth2:
      type: oauth2
      description: LinkedIn 3-legged OAuth 2.0 (authorization code).
      flows:
        authorizationCode:
          authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
          tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
          scopes:
            r_ads: LinkedIn permission `r_ads`
            rw_dmp_segments: LinkedIn permission `rw_dmp_segments`
            r_basicprofile: LinkedIn permission `r_basicprofile`
  parameters:
    LinkedInVersion:
      name: LinkedIn-Version
      in: header
      required: true
      description: API version in YYYYMM format (e.g. `202509`).
      schema:
        type: string
        pattern: ^[0-9]{6}$
    RestliProtocolVersion:
      name: X-Restli-Protocol-Version
      in: header
      required: false
      schema:
        type: string
        enum:
        - 2.0.0
        default: 2.0.0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        serviceErrorCode:
          type: integer
        message:
          type: string
    GetAdAccountsResponse:
      type: object
      properties:
        paging:
          type: object
          properties:
            start:
              type: integer
            count:
              type: integer
            links:
              type: array
              items: {}
            total:
              type: integer
        elements:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reference:
                type: string
              id:
                type: integer
              test:
                type: boolean
    GetDmpSegmentsResponse:
      type: object
      properties:
        paging:
          type: object
          properties:
            start:
              type: integer
            count:
              type: integer
            links:
              type: array
              items: {}
            total:
              type: integer
        elements:
          type: array
          items:
            type: object
            properties:
              created:
                type: integer
                format: int64
              destinations:
                type: array
                items:
                  type: object
                  properties:
                    audienceSize:
                      type: integer
                    created:
                      type: integer
                      format: int64
                    destinationSegmentId:
                      type: string
                    destination:
                      type: string
                    matchedCount:
                      type: integer
                    lastModified:
                      type: integer
                      format: int64
                    status:
                      type: string
              name:
                type: string
              sourcePlatform:
                type: string
              lastModified:
                type: integer
                format: int64
              accessPolicy:
                type: string
              id:
                type: integer
              type:
                type: string
              account:
                type: string
              inputCount:
                type: integer
    PostDmpSegmentsRequest:
      type: object
      properties:
        name:
          type: string
        sourcePlatform:
          type: string
        account:
          type: string
        type:
          type: string
        destinations:
          type: array
          items:
            type: object
            properties:
