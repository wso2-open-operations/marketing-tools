        default:
          $ref: '#/components/responses/Error'
  /documents/{documentId}:
    get:
      operationId: getASingleDocument
      summary: Get a Single Document
      tags:
      - r_member_social
      description: Get a single document. DocumentsService only checks W_MEMBER_SOCIAL on write/actor validation;
        no read-permission check exists in code.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: documentId
        in: path
        required: true
        description: Resource identifier (numeric id, or URL-encoded URN where the API expects one).
        schema:
          type: string
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
  /documents:
    get:
      operationId: findDocumentsByAssociatedAccountMember
      summary: Find Documents by Associated Account (Member)
      tags:
      - r_member_social
      description: FINDER associatedAccount for a member's documents. No read-permission check exists in code.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: q
        in: query
        required: true
        schema:
          type: string
          enum:
          - associatedAccount
        description: Rest.li finder name. Selects which query this call performs.
      - name: associatedAccount
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success (inferred — the source collection has no saved example for this call)
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: initializeDocumentUploadMemberOwner
      summary: Initialize Document Upload (Member Owner)
      tags:
      - w_member_social
      description: Initializes a document upload owned by a member. DocumentsService.validateOwnerTypeBasedOnPermissions()
        requires w_member_social when owner is a person URN. Returns an uploadUrl + document URN used to seed sample
        document content.
      parameters:
      - $ref: '#/components/parameters/LinkedInVersion'
      - $ref: '#/components/parameters/RestliProtocolVersion'
      - name: action
