        "503": {$ref: "#/components/responses/Problem"}
  /admin/announcements/{id}/send:
    parameters: [{$ref: "#/components/parameters/CampaignId"}]
    post:
      tags: [S5 Admin]
      operationId: sendAnnouncement
      x-access: CAN_ADMIN
      description: Queues the Novera announcement of an open post that has none yet (the Operations board's Not announced); the next Run sends it. A post whose announcement failed is retried instead (409 ANNOUNCEMENT_NOT_FAILED). Refused while `announcements.enabled` is false.
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementSend"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /admin/settings:
    get:
      tags: [S5 Admin]
      operationId: listSettings
      x-access: CAN_ADMIN
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      responses:
        "200":
          description: Settings, every editable key (the Coins settings included)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    put:
      tags: [S5 Admin]
      operationId: changeSettings
      x-access: CAN_ADMIN
      description: Changes known settings in one transaction, each guarded by its `version`. A new `leaderboard.top_n` asks amplify-jobs to rebuild the standings. A change to `run.schedule`, `run.enabled` or `maintenance.schedule` is pushed to the scheduler after the commit (ADR-026); the answer carries `schedulerSync` (`PENDING` when the scheduler couldn't be reached; the save still stands).
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingChanges"}
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingList"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /po/settings:
    get:
      tags: [S5 Admin]
      operationId: listPoSettings
      x-access: CAN_POINT_RULES
      description: The business settings the PO team changes on Amplify Admin, `coin.block_points`, `coin.block_coins`, `coin.schedule` and `external_share.daily_limit`.
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      responses:
        "200":
          description: The PO settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    put:
      tags: [S5 Admin]
      operationId: changePoSettings
      x-access: CAN_POINT_RULES
      description: Changes the PO settings, each guarded by its `version`. Any other key is refused with 403 `ROLE_NOT_PERMITTED` (switches, limits and schedules are an admin's, through `PUT /admin/settings`).
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingChanges"}
      responses:
        "200":
          description: The PO settings after the change
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingList"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /admin/linkedin-page:
    get:
      tags: [S5 Admin]
      operationId: getLinkedInPage
      x-access: CAN_ADMIN
      description: The company page connection (Community Management) for the configured page, and today's calls against `engagement.daily_call_budget`.
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      responses:
        "200":
          description: Page connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkedInPage"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [S5 Admin]
      operationId: disconnectLinkedInPage
      x-access: CAN_ADMIN
      description: Revokes the page token at LinkedIn, deletes the token rows and marks the connection revoked (audited). 503 when LinkedIn couldn't confirm; the connection is kept.
      parameters: [{$ref: "#/components/parameters/CorrelationId"}]
      responses:
        "204": {description: Disconnected (or never connected)}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /admin/linkedin-page/connect/start:
    post:
      tags: [S5 Admin]
      operationId: startLinkedInPageConnect
      x-access: CAN_ADMIN
      description: Starts the page OAuth flow with the Community Management app and the page scopes only (`r_organization_social_feed rw_organization_admin`). Issues a single-use state valid for 10 minutes.
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: Redirect the browser to `authorizationUrl`
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectAuthorization"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /admin/linkedin-page/connect/complete:
    post:
      tags: [S5 Admin]
      operationId: completeLinkedInPageConnect
      x-access: CAN_ADMIN
      description: >-
        Completes the page flow. The state must be the caller's page state, unused and unexpired; `redirectUri` the
        configured page callback. Exchanges the code and checks the admin is an approved ADMINISTRATOR of the page
        (403 `NOT_PAGE_ADMIN` otherwise), then seals the tokens as ORG and upserts the connection (audited).
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectComplete"}
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LinkedInPage"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /admin/scheduler/sync:
    post:
      tags: [S5 Admin]
      operationId: syncScheduler
      x-access: CAN_ADMIN
      description: Converges the scheduler's jobs (`amplify-run`, `amplify-maintenance-partitions`, `amplify-engagement-sync`, `amplify-coins-convert`, `amplify-reach-refresh`) to the schedule settings (ADR-026). Safe to repeat. 503 `SCHEDULER_UNAVAILABLE` when the scheduler can't be reached.
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: Scheduler matches the settings (or no scheduler is configured)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulerSync"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}

components:
  securitySchemes:
    backendJwt:
      type: apiKey
      in: header
      name: x-jwt-assertion
      description: Backend JWT signed by the API proxy (ADR-022).
  headers:
    CorrelationId:
      description: Echo of the caller's `X-Correlation-ID`, or a generated one
      schema: {type: string}
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key per caller (1-255 characters), remembered 24 hours.
      schema: {type: string, minLength: 1, maxLength: 255}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Period:
      name: period
      in: query
      schema: {type: string, pattern: "^(ALL|[0-9]{4}-(0[1-9]|1[0-2])|[0-9]{4}-Q[1-4])$", default: ALL}
    CampaignId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExternalShareId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: Problem details (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, description: "`urn:wso2:amplify:problem:<code>`"}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          description: Stable code; the client branches on this, never on `detail`.
          x-stable-codes: [TOKEN_MISSING, TOKEN_MALFORMED, TOKEN_ALG_NOT_ALLOWED, TOKEN_SIGNATURE_INVALID,
            TOKEN_EXPIRED, TOKEN_NOT_YET_VALID, TOKEN_ISSUER_INVALID, TOKEN_AUDIENCE_INVALID, TOKEN_CLAIMS_INVALID,
            ROUTE_NOT_PERMITTED, ROLE_NOT_PERMITTED, DEPENDENCY_UNAVAILABLE, EMAIL_CONFLICT, VALIDATION_FAILED,
            NOT_FOUND, METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_IN_PROGRESS, INTERNAL_ERROR,
            CAMPAIGN_ALREADY_REGISTERED, NOT_WSO2_RESOURCE, INVALID_CAMPAIGN, INVALID_WINDOW, CAMPAIGN_ARCHIVED,
            POST_HAS_ACTIVITY, CAMPAIGN_CLOSED, OAUTH_STATE_INVALID, OAUTH_REDIRECT_MISMATCH, MISSING_SCOPE, MEMBER_ALREADY_LINKED, CONNECTION_REMOVED,
            LINKEDIN_NOT_CONNECTED, NEEDS_RECONNECT, DUPLICATE_ACTION, COMMENTARY_REQUIRED, COMMENTARY_NOT_ALLOWED,
            COMMENTARY_TOO_LONG, FEATURE_DISABLED, CERTIFICATION_REQUIRED, EVIDENCE_ALREADY_CLAIMED,
            INVALID_EVIDENCE_URL, EVIDENCE_URL_NOT_HTTPS, EVIDENCE_URL_TOO_LONG, EVIDENCE_URL_CREDENTIALS,
            EVIDENCE_URL_IP_HOST, NOT_PENDING, SELF_REVIEW, REASON_REQUIRED, NOT_APPROVED, ALREADY_AMPLIFIED,
            RULE_NOT_FOUND, RULE_VERSION_EXISTS, RULE_BACKDATED, INVALID_POINTS, TOP_UP_NOT_POSITIVE,
            ALREADY_REVERSED, CANNOT_REVERSE_REVERSAL, INVALID_LEDGER_REFERENCE, TEAM_SCOPE,
            ANNOUNCEMENT_NOT_FAILED, UNKNOWN_SETTING, INVALID_SETTING, SCHEDULER_UNAVAILABLE, INVALID_EMPLOYEE_ID,
            INVALID_EMAIL, INVALID_MEMBER_URN, INVALID_POST_URN, INVALID_UUID, SHARE_NOT_QUEUED, PAID_NOT_ALLOWED,
            ALREADY_ANNOUNCED, ANNOUNCEMENT_NOT_QUEUED, COMMENTARY_NOT_OWN_WORDS, DAILY_LIMIT_REACHED, NOTE_TOO_LONG,
            NOT_PAGE_ADMIN, ALREADY_PAID, NO_WALLET, COINS_UNAVAILABLE, REACH_SCOPE_MISSING]
        detail: {type: string, nullable: true}
        correlationId: {type: string, nullable: true}
    CoinWallet:
      type: object
      required: [walletAddress, capturedAt]
      properties:
        walletAddress: {type: string, description: "Masked: the first 6 and last 4 characters (0x12ab…9f3c)"}
        capturedAt: {type: string, format: date-time}
    HealthStatus:
      type: object
      required: [component, status]
      properties:
        component: {type: string}
        status: {type: string, enum: [UP, DOWN]}
    ReadyStatus:
      type: object
      required: [component, status, database, breakers]
      properties:
        component: {type: string}
        status: {type: string, enum: [UP, DOWN]}
        database: {type: string, enum: [UP, DOWN]}
        breakers:
          type: object
          required: [database, jwks, jobs, roster, linkedinOAuth, linkedinApi, linkedinIdTokenJwks, coins]
          properties:
            database: {$ref: "#/components/schemas/BreakerState"}
            jwks: {$ref: "#/components/schemas/BreakerState"}
            jobs: {$ref: "#/components/schemas/BreakerState"}
            roster: {$ref: "#/components/schemas/BreakerState"}
            linkedinOAuth: {$ref: "#/components/schemas/BreakerState"}
            linkedinApi: {$ref: "#/components/schemas/BreakerState"}
            linkedinIdTokenJwks:
              allOf: [{$ref: "#/components/schemas/BreakerState"}]
              description: LinkedIn OIDC JWKS (ID-token validation on connect). Reported, never gates readiness; NOT_CONFIGURED while linkedinIdTokenValidation is off
            coins:
              allOf: [{$ref: "#/components/schemas/BreakerState"}]
              description: WSO2 Coins transaction service (wallet capture, ADR-048). Reported, never gates readiness
    BreakerState:
      type: string
      enum: [CLOSED, HALF_OPEN, OPEN, NOT_CONFIGURED]
      description: "`NOT_CONFIGURED` = the dependency has no URL / client id in this deployment (gauge -1, ADR-028)"
    Me:
      type: object
      required: [employee, roles, grants, capabilities, linkedin, config]
      properties:
        employee:
          type: object
          required: [employeeId, email, displayName]
          properties:
            employeeId: {type: string}
            email: {type: string}
            displayName: {type: string}
        roles:
          description: The caller's Asgardeo groups that the access configuration names
          type: array
          items: {type: string}
        grants:
          description: Grants from those groups; `EMPLOYEE` always. The UI gates on these, never on group names
          type: array
          items: {type: string, enum: [EMPLOYEE, CAN_CAMPAIGN, CAN_DASHBOARD, CAN_EXPORT, CAN_REVIEW_SHARES, CAN_POINT_RULES, CAN_ADJUST_POINTS, CAN_PO_DASHBOARD, CAN_REPORTS, CAN_ADMIN]}
        capabilities: {type: array, items: {type: string}}
        linkedin:
          type: object
          required: [status]
          properties:
            status: {$ref: "#/components/schemas/ConnectionStatus"}
            expiresAt: {type: string, format: date-time, nullable: true}
        config:
          description: Deployment settings the UI needs (Choreo configs, not UI config)
          type: object
          required: [linkedinOrgUrn, privacyNoticeUrl, campaignLinkOrigins]
          properties:
            linkedinOrgUrn: {description: "LinkedIn company page a registered post must belong to (`wso2OrganizationUrn`)", type: string}
            privacyNoticeUrl: {description: "Privacy notice for the consent dialog; empty = no link (`privacyNoticeUrl`)", type: string}
            campaignLinkOrigins: {description: "Origins a campaign link may use (`campaignLinkOrigins`)", type: array, items: {type: string}}
    ConnectionStatus: {type: string, enum: [ACTIVE, EXPIRING, NEEDS_RECONNECT, REMOVED, NOT_CONNECTED]}

    CampaignStatus: {type: string, enum: [SCHEDULED, OPEN, CLOSED, ARCHIVED]}
    Campaign:
      type: object
      required: [id, provider, resourceUrn, resourceType, ownerUrn, title, categoryCode, isPriority, tags, opensAt, closesAt, status, createdBy, createdAt, updatedAt, version]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [linkedin]}
        resourceUrn: {type: string}
        resourceType: {type: string, enum: [SHARE, UGC_POST, ARTICLE, VIDEO, DOCUMENT, EVENT, OTHER]}
        ownerUrn: {type: string}
        resourceUrl: {type: string, nullable: true}
        title: {type: string}
        summary: {type: string, nullable: true}
        imageUrl: {type: string, nullable: true}
        categoryCode: {type: string}
        isPriority: {type: boolean}
        tags: {type: array, items: {type: string}}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        archivedAt: {type: string, format: date-time, nullable: true}
        status: {$ref: "#/components/schemas/CampaignStatus"}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer}
    CampaignPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Campaign"}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    CampaignDraft:
      type: object
      additionalProperties: false
      required: [resourceUrn, ownerUrn, title, categoryCode]
      properties:
        resourceUrn: {type: string, maxLength: 255, example: "urn:li:share:7123"}
        ownerUrn: {type: string, maxLength: 255, example: "urn:li:organization:1477"}
        resourceUrl: {type: string, maxLength: 2048}
        title: {type: string, minLength: 1, maxLength: 200}
        summary: {type: string, maxLength: 2000}
        imageUrl: {type: string, maxLength: 2048}
        categoryCode: {type: string, maxLength: 50}
        isPriority: {type: boolean, default: false}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time, description: "Default `opensAt` + `campaign.default_window_days` (C7)"}
    CampaignPatch:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: Version read before the edit}
        resourceUrn:
          type: string
          maxLength: 255
          example: "urn:li:share:7123"
          description: >-
            New post id, same rules as registration. Allowed only while nothing is recorded against the campaign
            (no share requests, reposts, external shares or points entries for the campaign); otherwise 409 `POST_HAS_ACTIVITY`. An id another
            campaign already has answers 409 `CAMPAIGN_ALREADY_REGISTERED`.
        resourceUrl:
          type: string
          maxLength: 2048
          description: New link to the post, same origin rules as registration (`campaignLinkOrigins`). Blank clears it.
        title: {type: string, minLength: 1, maxLength: 200}
        summary: {type: string, maxLength: 2000}
        imageUrl: {type: string, maxLength: 2048}
        categoryCode: {type: string, maxLength: 50}
        isPriority: {type: boolean}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
    CampaignRegistration:
      type: object
      required: [campaign, run]
      properties:
        campaign: {$ref: "#/components/schemas/Campaign"}
        run:
          type: string
          enum: [NOT_REQUESTED, STARTED, DEFERRED]
          description: "`STARTED` = the Run trigger was sent; `DEFERRED` = jobs unreachable or breaker open, the next scheduled Run picks it up"
    TagList:
      type: object
      required: [tags]
      properties:
        tags: {type: array, items: {type: string}}
    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [code, label, sortOrder]
            properties:
              code: {type: string}
              label: {type: string}
              sortOrder: {type: integer}

    ConnectStart:
      type: object
      additionalProperties: false
      properties:
        returnTo: {type: string, maxLength: 512, pattern: '^/([^/\\\s][^\\\s]*)?$', description: "One WSO2 path (relative) to come back to; no `//`, backslash or whitespace (open redirect)"}
        pendingCampaignId: {type: string, format: uuid}
    ConnectAuthorization:
      type: object
      required: [authorizationUrl, state, expiresAt]
      properties:
        authorizationUrl: {type: string}
        state: {type: string}
        expiresAt: {type: string, format: date-time}
    ConnectComplete:
      type: object
      additionalProperties: false
      required: [code, state, redirectUri]
      properties:
        code: {type: string, minLength: 1, maxLength: 2048}
        state: {type: string, minLength: 32, maxLength: 128}
        redirectUri:
          type: string
          maxLength: 2048
          description: The callback page that received the code (no query). Required. It must equal the redirect URI Amplify put on the authorize request, else 422 `OAUTH_REDIRECT_MISMATCH`.
    LinkedInConnection:
      type: object
      required: [status, memberUrn, connectedAt, expiresAt]
      properties:
        status: {$ref: "#/components/schemas/ConnectionStatus"}
        memberUrn: {type: string}
        connectedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        returnTo: {type: string, nullable: true}
        pendingCampaignId: {type: string, nullable: true}

    ShareKind: {type: string, enum: [REPOST, REPOST_COMMENTARY, SHARE, SHARE_COMMENTARY]}
    ShareCommand:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {$ref: "#/components/schemas/ShareKind"}
        commentary: {type: string, maxLength: 3000, description: "Required for `*_COMMENTARY`, refused otherwise"}
    Share:
      type: object
      required: [id, campaignId, kind, status, attempts, requestedAt]
      properties:
        id: {type: string, format: uuid}
        campaignId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ShareKind"}
        status: {type: string, enum: [QUEUED, PUBLISHED, FAILED]}
        failureReason: {type: string, nullable: true, enum: [NEEDS_RECONNECT, PROVIDER_REJECTED, RETRIES_EXHAUSTED, null]}
        attempts: {type: integer}
        requestedAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}
        failedAt: {type: string, format: date-time, nullable: true}
        metrics: {type: object, nullable: true, description: Share metrics (future phase); always null in phase 1}
    ShareList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Share"}}
    NativeIntent:
      type: object
      required: [campaignId, openedAt, detectedAt, nativeStatus]
      properties:
        campaignId: {type: string, format: uuid}
        openedAt: {type: string, format: date-time}
        detectedAt: {type: string, format: date-time, nullable: true}
        nativeStatus: {type: string, enum: [LOOKING, DETECTED, NOT_FOUND]}
    NativeIntentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/NativeIntent"}}
    ReachConnection:
      type: object
      required: [connected, status, connectedAt, accessExpiresAt]
      properties:
        connected: {type: boolean}
        status: {type: string, enum: [NOT_CONNECTED, CONNECTED, EXPIRED], description: "EXPIRED: the token lapsed and can't be renewed; connect again"}
        connectedAt: {type: string, format: date-time, nullable: true}
        accessExpiresAt: {type: string, format: date-time, nullable: true}
    LinkedInPage:
      type: object
      required: [connected, connectedByName, connectedAt, accessExpiresAt, callsToday, dailyBudget]
      properties:
        connected: {type: boolean}
        connectedByName: {type: string, nullable: true}
        connectedAt: {type: string, format: date-time, nullable: true}
        accessExpiresAt: {type: string, format: date-time, nullable: true}
        callsToday: {type: integer, minimum: 0}
        dailyBudget: {type: integer, minimum: 0}

    ExternalShareClaim:
      type: object
      additionalProperties: false
      required: [certified]
      description: "Send exactly one of `evidenceUrl` and `activityId` (both or neither is a `VALIDATION_FAILED` 400), and `certified` must be true."
      oneOf:
        - required: [evidenceUrl]
        - required: [activityId]
      properties:
        evidenceUrl: {type: string, minLength: 1, maxLength: 2048, description: "Any public HTTPS URL; never fetched. `lnkd.in` short links are refused (`INVALID_EVIDENCE_URL`): one post could otherwise be claimed twice"}
        activityId: {type: string, minLength: 1, maxLength: 100, pattern: "^[0-9]+$", description: "A LinkedIn post number (the activity id: the digits in `urn:li:activity:<number>` or `...-activity-<number>-...`). Amplify builds the canonical post URL from it, stores that as `evidenceUrl`, and so it collides with any other form of the same post (`EVIDENCE_ALREADY_CLAIMED`)"}
        certified: {type: boolean, enum: [true], description: "\"I certify this is related to Choreo Labs\" (must be true)"}
        campaignId: {type: string, format: uuid}
        note: {type: string, maxLength: 500, description: "Optional note for the reviewer; blank counts as none (`NOTE_TOO_LONG` past 500 characters)"}
    ExternalShare:
      type: object
      required: [id, employeeId, action, evidenceUrl, evidenceHost, evidenceProvider, status, createdAt, version]
      properties:
        id: {type: string, format: uuid}
        employeeId: {type: string}
        campaignId: {type: string, nullable: true}
        action: {type: string, enum: [OWN_POST]}
        evidenceUrl: {type: string}
        evidenceHost: {type: string}
        evidenceProvider: {type: string, enum: [linkedin, medium, other]}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, AMPLIFIED]}
        decidedBy: {type: string, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        decisionReason: {type: string, nullable: true}
        amplifiedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        version: {type: integer}
        note: {type: string, nullable: true, description: "The employee's note for the reviewer"}
        employeeName: {type: string, nullable: true, description: "Who sent it, on `GET /po/external-shares` items only"}
        employeeEmail: {type: string, nullable: true, description: "Their work email, on `GET /po/external-shares` items only"}
    PersonMatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [employeeId, displayName, email]
            properties:
              employeeId: {type: string}
              displayName: {type: string}
              email: {type: string}
    ExternalShareList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ExternalShare"}}
    ExternalSharePage:
      type: object
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ExternalShare"}}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}

    PointAction: {type: string, enum: [REPOST, REPOST_COMMENTARY, SHARE, SHARE_COMMENTARY, OWN_POST, OWN_POST_AMPLIFIED, REACTION, COMMENT, CHALLENGE_ENTRY, CHALLENGE_WINNER]}
    PointRule:
      type: object
      required: [id, action, points, effectiveFrom, createdBy, createdAt, inForce]
      properties:
        id: {type: string}
        action: {$ref: "#/components/schemas/PointAction"}
        points: {type: integer, minimum: 0}
        effectiveFrom: {type: string, format: date-time}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        inForce: {type: boolean}
    PointRuleList:
      type: object
      required: [rules]
      properties:
        rules: {type: array, items: {$ref: "#/components/schemas/PointRule"}}
    PointRuleDraft:
      type: object
      additionalProperties: false
      required: [action, points]
      properties:
        action: {$ref: "#/components/schemas/PointAction"}
        points: {type: integer, minimum: 0, maximum: 10000}
        effectiveFrom: {type: string, format: date-time, description: Default now; never in the past}
    PointsAdjustment:
      type: object
      additionalProperties: false
      required: [employeeId, points, reason]
      properties:
        employeeId: {type: string, maxLength: 255}
        points: {type: integer, minimum: -10000, maximum: 10000, description: "Signed, not zero"}
        reason: {type: string, minLength: 1, maxLength: 1000}
        campaignId: {type: string, format: uuid}
    LedgerEntry:
      type: object
      required: [reference, employeeId, sourceType, points, createdAt]
      properties:
        reference: {type: string}
        employeeId: {type: string}
        campaignId: {type: string, nullable: true}
        sourceType: {type: string, enum: [ENGAGEMENT, EXTERNAL_SHARE, ADJUSTMENT, REVERSAL]}
        action: {type: string, nullable: true}
        points: {type: integer}
        reason: {type: string, nullable: true, description: "A PO's free text. The person the row belongs to sees it too; other callers who are not a PO get the fixed label 'Adjusted by the PO team' on adjustment and reversal rows, and null on the others"}
        reversesReference: {type: string, nullable: true}
        actorId: {type: string, description: "The PO's employee id. Omitted for callers who are not a PO"}
        createdAt: {type: string, format: date-time}
        status: {type: string, nullable: true, enum: [HELD, PAID, null]}
        paidAt: {type: string, format: date-time, nullable: true, description: "When the row became Coins (PAID only)"}
        coinReference: {type: string, nullable: true, description: "The CNV- reference of the Coins conversion that took the row (set while the transfer is in progress, kept once PAID; ADR-048)"}
        campaignTitle: {type: string, nullable: true, description: "History rows only: the post the points were earned on"}
        reversedBy: {type: string, nullable: true, description: "History rows only: the reference of the row that reversed this one"}
        settlement: {type: string, enum: [HELD, PAID, ACTION_REQUIRED], description: "History rows only: HELD counts toward the next Coins, PAID became Coins, ACTION_REQUIRED waits for the PO team"}

    HistoryItem:
      type: object
      description: >-
        One history row. `kind: LEDGER` is a ledger row (the `LedgerEntry` fields plus `campaignTitle`, `reversedBy`,
        `settlement`). `kind: COIN_CONVERSION` is one Coins conversion (ADR-048): `points` converted (whole blocks x
        block points) became `coins`, dated when sent (else when attempted); the ledger rows it paid carry its
        `reference` as `coinReference`.
      required: [kind, reference, employeeId, points, createdAt]
      properties:
        kind: {type: string, enum: [LEDGER, COIN_CONVERSION]}
        reference: {type: string, description: "Ledger reference, or the conversion's CNV- reference"}
        employeeId: {type: string}
        points: {type: integer, description: "LEDGER: signed points; COIN_CONVERSION: points converted"}
        createdAt: {type: string, format: date-time}
        campaignId: {type: string, nullable: true}
        sourceType: {type: string, enum: [ENGAGEMENT, EXTERNAL_SHARE, ADJUSTMENT, REVERSAL]}
        action: {type: string, nullable: true}
        reason: {type: string, nullable: true, description: "As in LedgerEntry"}
        reversesReference: {type: string, nullable: true}
        actorId: {type: string, description: "The PO's employee id. Omitted for callers who are not a PO"}
        status: {type: string, nullable: true, enum: [HELD, PAID, null]}
        paidAt: {type: string, format: date-time, nullable: true}
        coinReference: {type: string, nullable: true}
        campaignTitle: {type: string, nullable: true}
        reversedBy: {type: string, nullable: true}
        settlement: {type: string, enum: [HELD, PAID, ACTION_REQUIRED]}
        coins: {type: integer, description: "COIN_CONVERSION only: Coins sent"}
        conversionStatus: {type: string, enum: [SENT, IN_PROGRESS], description: "COIN_CONVERSION only: SENT, or IN_PROGRESS while the transfer is not confirmed"}
        transferReference: {type: string, nullable: true, description: "COIN_CONVERSION only: the WSO2 Coins transfer reference (SENT); null for teammates"}

    LeaderboardTop:
      type: object
      required: [period, topN, generatedAt, company, me]
      properties:
        period: {type: string, enum: [MONTH, ALL]}
        minPoints: {type: integer, nullable: true, description: "Always null. The Celebrate top three has no points minimum (ADR-037); everyone with points this month is ranked. `leaderboard.top_min_points` is kept for the Coins award, a later phase. Null for ALL."}
        monthStart: {type: string, format: date-time, nullable: true, description: "The 1st 00:00 UTC; null for ALL"}
        monthEnd: {type: string, format: date-time, nullable: true, description: "The next 1st 00:00 UTC; null for ALL"}
        topN: {type: integer}
        generatedAt: {type: string, format: date-time, description: "When the monthly totals were read (up to 2 hours ago)"}
        company:
          type: array
          items:
            type: object
            required: [employeeId, displayName, email, points, rank]
            properties:
              employeeId: {type: string}
              displayName: {type: string}
              email: {type: string}
              points: {type: integer}
              rank: {type: integer}
              previousRank: {type: integer, nullable: true}
              reachedAt: {type: string, format: date-time, nullable: true, description: "When the person reached these points: their latest points entry in the scope. Ties on points are ordered by it, earliest first. Only callers with `CAN_DASHBOARD` get a value; null for everyone else."}
        me: {$ref: "#/components/schemas/PersonalStanding"}
    Leaderboard:
      type: object
      required: [period, topN, generatedAt, company, me, teamStatus]
      properties:
        period: {type: string}
        topN: {type: integer}
        generatedAt: {type: string, format: date-time}
        company:
          type: array
          items:
            type: object
            required: [employeeId, displayName, email, points, rank]
            properties:
              employeeId: {type: string}
              displayName: {type: string}
              email: {type: string}
              points: {type: integer}
              rank: {type: integer}
              previousRank: {type: integer, nullable: true}
        me: {$ref: "#/components/schemas/PersonalStanding"}
        myTeam:
          type: object
          nullable: true
          required: [teamName, headcount, activeCount, entries]
          properties:
            teamName: {type: string}
            headcount: {type: integer}
            activeCount: {type: integer}
            entries:
              type: array
              items:
                type: object
                required: [employeeId, displayName, email, points, teamRank, companyRank, isMe]
                properties:
                  employeeId: {type: string, nullable: true, description: "Null for a team member nobody has recorded points for (no standing row), whether or not they ever signed in. Such an entry has points 0 and no companyRank."}
                  displayName: {type: string, description: "The people directory's name, else the standing's, else the email"}
                  email: {type: string}
                  points: {type: integer}
                  teamRank: {type: integer, description: "Dense rank within the team; every zero-point member shares the last rank"}
                  companyRank: {type: integer, nullable: true, description: "Null without a standing row"}
                  houseName: {type: string, nullable: true, description: "The member's house from the people directory"}
                  isMe: {type: boolean}
        teamStatus: {type: string, enum: [OK, NO_TEAM, UNAVAILABLE]}
    PersonalStanding:
      type: object
      required: [employeeId, inTopN]
      properties:
        employeeId: {type: string}
        points: {type: integer, nullable: true}
        rank: {type: integer, nullable: true}
        previousRank: {type: integer, nullable: true}
        pointsToNextRank: {type: integer, nullable: true}
        pointsToTopN: {type: integer, nullable: true}
        inTopN: {type: boolean}
        lastActivityAt: {type: string, format: date-time, nullable: true}
    MyPoints:
      type: object
      required: [period, standing, monthly, coins]
      properties:
        period: {type: string}
        standing: {$ref: "#/components/schemas/PersonalStanding"}
        coins:
          type: object
          description: Coins for points. Points convert automatically, only in whole blocks; the rest carries over (ADR-048).
          required: [walletsEnabled, blockPoints, blockCoins, schedule, heldPoints, carryPoints, pointsTowardNext,
            coinsReceived, wallet]
          properties:
            walletsEnabled: {type: boolean, description: "The automatic conversion sends Coins to captured wallets (false: points keep counting)"}
            blockPoints: {type: integer}
            blockCoins: {type: integer}
            schedule: {type: string, enum: [MONTHLY, WEEKLY, DAILY]}
            heldPoints: {type: integer, description: "Points not yet paid out"}
            carryPoints: {type: integer, description: "What the last conversion carried over; counts toward the next block"}
            pointsTowardNext: {type: integer, description: "Progress to the next block (held plus carry)"}
            coinsReceived: {type: integer, description: "Coins the conversion has sent to the caller"}
            wallet:
              allOf: [{$ref: "#/components/schemas/CoinWallet"}]
              nullable: true
              description: The captured wallet (masked), null until `POST /me/coins/wallet`
        monthly:
          type: array
          items:
            type: object
            required: [month, points, actions]
            properties:
              month: {type: string}
              points: {type: integer}
              actions: {type: integer}
    TeamPage:
      type: object
      required: [period, scope, page, size, total, summary, entries, teamStatus]
      properties:
        period: {type: string}
        scope: {type: string, enum: [TEAM, COMPANY]}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
        teamStatus: {type: string, enum: [OK, NO_TEAM, UNAVAILABLE]}
        summary:
          type: object
          required: [activeCount]
          properties:
            headcount: {type: integer, nullable: true, description: "Roster size from the people directory; on the company view everyone the directory lists. Null when the directory cannot supply it (no roster, or the company view falling back to standings)"}
            activeCount: {type: integer, description: "People in the roster with points"}
        entries:
          type: array
          items:
            type: object
            required: [employeeId, displayName, email, points, rank, teamRank, actions]
            properties:
              employeeId: {type: string, nullable: true, description: "Null for a person nobody has recorded points for (no standing row), whether or not they ever signed in. Such an entry has points 0 and no rank. Do not link to a person page or history for it."}
              displayName: {type: string, description: "The people directory's name, else the standing's, else the email"}
              email: {type: string}
              points: {type: integer}
              rank: {type: integer, nullable: true, description: "Company rank; null without a standing row"}
              teamRank: {type: integer, description: "Dense rank within the list; every zero-point person shares the last rank. Ties order by name, then email"}
              previousRank: {type: integer, nullable: true}
              lastActivityAt: {type: string, format: date-time, nullable: true}
              actions:
                type: object
                required: [canAdjust, canReverse]
                properties:
                  canAdjust: {type: boolean}
                  canReverse: {type: boolean}
    LeaderboardPeople:
      type: object
      required: [period, scope, page, size, total, summary, entries]
      properties:
        period: {type: string}
        scope: {type: string, enum: [COMPANY, BU, TEAM]}
        businessUnit: {type: string, nullable: true}
        team: {type: string, nullable: true, description: "Team key (BU and TEAM scopes)"}
        teamName: {type: string, nullable: true}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
        summary:
          type: object
          required: [participants]
          properties:
            headcount: {type: integer, nullable: true, description: "Employees in the scope, from the cached count; null when the directory never loaded on the company view"}
            participants: {type: integer, description: "People in the scope with points"}
        entries:
          type: array
          items:
            type: object
            required: [employeeId, displayName, email, points, rank, scopeRank]
            properties:
              employeeId: {type: string}
              displayName: {type: string}
              email: {type: string}
              points: {type: integer}
              rank: {type: integer, description: "Company rank"}
              scopeRank: {type: integer, description: "Rank within the scope (equals rank on the company view)"}
              previousRank: {type: integer, nullable: true}
              lastActivityAt: {type: string, format: date-time, nullable: true}
    LeaderboardGroups:
      type: object
      required: [period, by, asOf, totals, entries, unassigned]
      properties:
        period: {type: string}
        by: {type: string, enum: [TEAM, BU, HOUSE]}
        businessUnit: {type: string, nullable: true}
        asOf: {type: string, format: date-time, description: "When the employee count was taken"}
        totals:
          type: object
          required: [headcount, participants, points]
          properties:
            headcount: {type: integer}
            participants: {type: integer}
            points: {type: integer}
        entries:
          type: array
          items:
            type: object
            required: [rank, key, name, points, participants, headcount, participationRate]
            properties:
              rank: {type: integer, description: "Dense rank, ties share a rank"}
              key: {type: string, description: "Opaque team key, or the BU name"}
              name: {type: string}
              businessUnit: {type: string, nullable: true}
              points: {type: integer}
              participants: {type: integer}
              headcount: {type: integer}
              participationRate: {type: number, description: "participants / headcount, 3 decimals"}
        unassigned:
          type: object
          required: [participants, points]
          description: People with points the directory doesn't place in a team or BU
          properties:
            participants: {type: integer}
            points: {type: integer}
    Headcount:
      type: object
      required: [asOf, cacheSeconds, total, businessUnits, teams]
      properties:
        asOf: {type: string, format: date-time, description: "When the directory was read"}
        cacheSeconds: {type: integer}
        total: {type: integer}
        businessUnits:
          type: array
          items:
            type: object
            required: [name, headcount]
            properties:
              name: {type: string}
              headcount: {type: integer}
        teams:
          type: array
          items:
            type: object
            required: [key, name, headcount]
            properties:
              key: {type: string}
              name: {type: string}
              businessUnit: {type: string, nullable: true}
              headcount: {type: integer}
    DashboardAnnouncement:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [NONE, QUEUED, SENT, FAILED], description: "NONE = no announcement row yet"}
        attempts: {type: integer, nullable: true, description: "Outbox attempts so far while QUEUED (the retry the worker is on); null otherwise"}
        sentAt: {type: string, format: date-time, nullable: true}
    DashboardCampaignRow:
      type: object
      required: [campaignId, title, categoryCode, categoryLabel, isPriority, opensAt, closesAt, reposts, repostsWithCommentary]
      properties:
        campaignId: {type: string}
        title: {type: string}
        categoryCode: {type: string}
        categoryLabel: {type: string}
        isPriority: {type: boolean}
        status: {type: string, enum: [SCHEDULED, OPEN, CLOSED, ARCHIVED]}
        opensAt: {type: string, format: date-time}
        closesAt: {type: string, format: date-time}
        reposts: {type: integer, description: "Active reposts recorded against the campaign (share actions only; synced reactions and comments are not reposts)"}
        repostsWithCommentary: {type: integer, description: "Of those, reposts with the employee's own commentary"}
        reactions: {type: integer, description: "Employees' reactions on the campaign post (engagement sync)"}
        comments: {type: integer, description: "Employees' comments on the campaign post (engagement sync)"}
        reach: {$ref: "#/components/schemas/DashboardReach"}
        announcement: {$ref: "#/components/schemas/DashboardAnnouncement"}
    DashboardReach:
      type: object
      required: [impressions, membersReached, measuredReposts, approximate]
      description: "Reach of the employees' reposts from LinkedIn's member post analytics, latest reading of each. Approximate: only reposts of employees who connected Reach are measured, and a member reached by two reposts counts twice"
      properties:
        impressions: {type: integer}
        membersReached: {type: integer}
        measuredReposts: {type: integer}
        approximate: {type: boolean, enum: [true]}
    DashboardOperations:
      type: object
      required: [asOf, kpis, campaigns, shareHealth, connections]
      properties:
        asOf: {type: string, format: date-time}
        headcount: {type: integer, nullable: true, description: "Employee count from /headcount; null when the people directory never loaded"}
        kpis:
          type: object
          required: [campaignsLive, campaignsLivePriority, campaignsClosingWithin7Days, repostsThisMonth, repostsThisMonthWithCommentary, repostsPrevMonth, peopleConnected, connectionsExpired, pointsThisMonth, pointsThisYear, peopleWithPoints]
          properties:
            campaignsLive: {type: integer}
            campaignsLivePriority: {type: integer}
            campaignsClosingWithin7Days: {type: integer}
            repostsThisMonth: {type: integer, description: "Since the 1st 00:00 UTC"}
            repostsThisMonthWithCommentary: {type: integer, description: "Of repostsThisMonth, with the employee's own commentary"}
            repostsPrevMonth: {type: integer, description: "Last calendar month"}
            peopleConnected: {type: integer}
            connectionsExpired: {type: integer}
            pointsThisMonth: {type: integer, description: "Since the 1st, UTC"}
            pointsThisYear: {type: integer, description: "Since 1 January, UTC"}
            peopleWithPoints: {type: integer}
        campaigns: {type: array, items: {$ref: "#/components/schemas/DashboardCampaignRow"}}
        shareHealth:
          type: object
          required: [windowStart, published, queued, failed, failedByReason]
          properties:
            windowStart: {type: string, format: date-time, description: "The 1st of the current month, 00:00 UTC"}
            published: {type: integer}
            queued: {type: integer}
            failed: {type: integer}
            failedByReason: {type: object, additionalProperties: {type: integer}}
        connections:
          type: object
          required: [active, expiring, expired, revoked]
          properties:
            active: {type: integer}
            expiring: {type: integer}
            expired: {type: integer, description: "Token past its expiry"}
            revoked: {type: integer, description: "Needs reconnect for another reason (revoked, token missing)"}
            neverConnected: {type: integer, nullable: true, description: "headcount minus connected; null without a headcount"}
    DashboardPerson:
      type: object
      required: [employeeId, displayName]
      properties:
        employeeId: {type: string}
        displayName: {type: string, description: "The id when Amplify never recorded a name"}
        email: {type: string, nullable: true, description: "Work email, the key to the people directory"}
    DashboardPersonBoard:
      type: object
      required: [employeeId, displayName, reposts, repostsWithCommentary, pointsThisMonth, campaigns, byCategory]
      properties:
        employeeId: {type: string}
        displayName: {type: string}
        email: {type: string, nullable: true}
        reposts: {type: integer, description: "Plain reposts"}
        repostsWithCommentary: {type: integer}
        pointsThisMonth: {type: integer, description: "Points earned since the 1st (UTC), adjustments and reversals included"}
        campaigns:
          type: array
          items:
            type: object
            required: [campaignId, title, categoryCode, categoryLabel, isPriority, opensAt, closesAt, reposts, repostsWithCommentary, points]
            properties:
              campaignId: {type: string}
              title: {type: string}
              categoryCode: {type: string}
              categoryLabel: {type: string}
              isPriority: {type: boolean}
              opensAt: {type: string, format: date-time}
              closesAt: {type: string, format: date-time}
              reposts: {type: integer}
              repostsWithCommentary: {type: integer}
              points: {type: integer, description: "Points the person earned on this post (ledger, reversals included)"}
        byCategory:
          type: array
          items:
            type: object
            required: [code, label, reposts, repostsWithCommentary, points]
            properties:
              code: {type: string}
              label: {type: string}
              reposts: {type: integer, description: "Plain reposts"}
              repostsWithCommentary: {type: integer}
              points: {type: integer, description: "Points earned on this category's posts"}
    DashboardCampaigns:
      type: object
      required: [asOf, windowDays, campaigns, byCategory]
      properties:
        asOf: {type: string, format: date-time}
        windowDays: {type: integer}
        peopleConnected: {type: integer}
        monthTotals:
          type: object
          description: "This calendar month (UTC): reposts, reactions and comments recorded, and the reach of the month's reposts"
          required: [month, reposts, reactions, comments, reach, reachConsenting]
          properties:
            month: {type: string, description: "YYYY-MM"}
            reposts: {type: integer}
            reactions: {type: integer}
            comments: {type: integer}
            reach: {$ref: "#/components/schemas/DashboardReach"}
            reachConsenting: {type: integer, description: "Employees with a Reach connection (reach is measured for them only)"}
        campaigns: {type: array, items: {$ref: "#/components/schemas/DashboardCampaignRow"}}
        selected:
          type: object
          nullable: true
          required: [campaignId, title, categoryCode, categoryLabel, isPriority, opensAt, closesAt, reposts, repostsWithCommentary, first24Hours, announcement, byDay, people]
          properties:
            summary: {type: string, nullable: true}
            imageUrl: {type: string, nullable: true}
            resourceUrl: {type: string, nullable: true}
            resourceUrn: {type: string}
            people:
              type: object
              description: "Everyone with an active repost of the campaign, by name"
              required: [reposts, withComments]
              properties:
                reposts: {type: array, items: {$ref: "#/components/schemas/DashboardPerson"}}
                withComments: {type: array, items: {$ref: "#/components/schemas/DashboardPerson"}}
            campaignId: {type: string}
            title: {type: string}
            categoryCode: {type: string}
            categoryLabel: {type: string}
            isPriority: {type: boolean}
            opensAt: {type: string, format: date-time}
            closesAt: {type: string, format: date-time}
            reposts: {type: integer}
            repostsWithCommentary: {type: integer}
            reactions: {type: integer}
            comments: {type: integer}
            reach: {$ref: "#/components/schemas/DashboardReach"}
            shareOfConnected: {type: number, nullable: true, description: "reposts / people connected, 3 decimals"}
            first24Hours: {type: integer}
            announcement: {$ref: "#/components/schemas/DashboardAnnouncement"}
            byDay:
              type: array
              description: "Seven entries, day 1 = the first 24 hours after opens_at"
              items:
                type: object
                required: [day, reposts]
                properties:
                  day: {type: integer}
                  reposts: {type: integer}
        byCategory:
          type: array
          items:
            type: object
            required: [code, label, reposts, repostsWithCommentary]
            properties:
              code: {type: string}
              label: {type: string}
              reposts: {type: integer, description: "Active engagements: reposts plus reposts with comments"}
              repostsWithCommentary: {type: integer, description: "Of those, with the employee's own commentary"}
    DashboardParticipation:
      type: object
      required: [asOf, funnel]
      properties:
        asOf: {type: string, format: date-time}
        funnel:
          type: object
          required: [connected, reposted, active30Days, expired]
          properties:
            employees: {type: integer, nullable: true}
            connected: {type: integer}
            reposted: {type: integer, description: "People with at least one active engagement"}
            active30Days: {type: integer, description: "People with an engagement in the last 30 days"}
            expired: {type: integer, description: "Connections past their expiry"}
        byLocation:
          type: array
          description: "Largest first, Other last"
          items:
            type: object
            required: [location, size, connected, reposted, active30Days, pointsThisMonth, reach]
            properties:
              location: {type: string, description: "Work location from the people directory, or Other"}
              size: {type: integer, description: "Directory headcount (the people counted when the directory is unavailable); at least minGroupSize except Other"}
              employees: {type: integer, nullable: true}
              connected: {type: integer}
              reposted: {type: integer}
              active30Days: {type: integer}
              pointsThisMonth: {type: integer}
              reach:
                type: object
                required: [membersReached, approximate]
                properties:
                  membersReached: {type: integer}
                  approximate: {type: boolean, enum: [true]}
        minGroupSize: {type: integer, description: "dashboards.min_group_size"}
        reachConsenting: {type: integer}
    DashboardGlance:
      type: object
      required: [asOf, month, reposts, monthly, participants, campaignsLive, campaignsReachingTarget, shareSuccess]
      properties:
        asOf: {type: string, format: date-time}
        month: {type: string}
        reposts:
          type: object
          required: [thisMonth, previousMonth]
          properties:
            thisMonth: {type: integer}
            previousMonth: {type: integer}
        monthly:
          type: array
          description: "Six calendar months, oldest first, the current month last (UTC)"
          items:
            type: object
            required: [monthStart, reposts]
            properties:
              monthStart: {type: string, description: "First day of the month, YYYY-MM-DD"}
              reposts: {type: integer}
        participants: {type: integer, description: "People with at least one engagement"}
        headcount: {type: integer, nullable: true}
        campaignsLive: {type: integer}
        campaignsReachingTarget:
          type: object
          required: [reached, live, thresholdPercent]
          properties:
            reached: {type: integer, description: "Live campaigns reposted by at least thresholdPercent of connected people"}
            live: {type: integer}
            thresholdPercent: {type: integer}
        shareSuccess:
          type: object
          required: [published, attempts]
          description: "This calendar month (UTC): published over published plus failed"
          properties:
            published: {type: integer}
            attempts: {type: integer}
        bestCampaign:
          type: object
          nullable: true
          properties:
            campaignId: {type: string}
            title: {type: string}
            categoryLabel: {type: string}
            isPriority: {type: boolean}
            reposts: {type: integer}
    DashboardScorecard:
      type: object
      required: [asOf, measures]
      properties:
        asOf: {type: string, format: date-time}
        measures:
          type: array
          items:
            type: object
            required: [key, label, unit, value, target, comparison, status]
            properties:
              key: {type: string, enum: [connected, expired, shareSuccess, announcements, priorityReach, active30Days, repostsPerMonth]}
              label: {type: string}
              unit: {type: string, enum: [PERCENT, COUNT]}
              value: {type: number}
              numerator: {type: integer, nullable: true}
              denominator: {type: integer, nullable: true}
              target: {type: number}
              comparison: {type: string, enum: [AT_LEAST, AT_MOST]}
              status: {type: string, enum: [ON_TRACK, WATCH]}
              note: {type: string, nullable: true}
    PointsHistory:
      type: object
      required: [employeeId, page, size, total, items]
      properties:
        employeeId: {type: string}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer}
        totalPoints: {type: integer, description: "All-time points of this person (every row, not just this page)"}
        heldPoints: {type: integer, description: "Their points not yet paid out as Coins"}
        items: {type: array, items: {$ref: "#/components/schemas/HistoryItem"}}

    PoDashboard:
      type: object
      required: [asOf, month, reviewQueue, reviewThroughput, actionRequired, points, participation, campaigns, shareHealth, recentCorrections]
      properties:
        asOf: {type: string, format: date-time}
        month: {type: string}
        reviewQueue:
          type: object
          required: [pending, overSla, slaHours]
          properties:
            pending: {type: integer}
            oldestPendingAt: {type: string, format: date-time, nullable: true}
            overSla: {type: integer}
            slaHours: {type: integer}
        reviewThroughput:
          type: object
          required: [windowStart, approved, rejected, amplified]
          properties:
            windowStart: {type: string, format: date-time, description: "The 1st of the current month, 00:00 UTC"}
            approved: {type: integer}
            rejected: {type: integer}
            amplified: {type: integer}
            medianHoursToDecision: {type: number, nullable: true}
        actionRequired:
          type: object
          required: [count]
          properties:
            count: {type: integer}
        points:
          type: object
          required: [monthTotal, allTimeTotal, byAction]
          properties:
            monthTotal: {type: integer}
            allTimeTotal: {type: integer}
            byAction:
              type: array
              items:
                type: object
                required: [action, points, rows]
                properties:
                  action: {type: string}
                  points: {type: integer}
                  rows: {type: integer}
        participation:
          type: object
          required: [connections, employeesWithPoints, activeLast30Days]
          properties:
            connections:
              type: object
              required: [active, expiring, needsReconnect]
              properties:
                active: {type: integer}
                expiring: {type: integer}
                needsReconnect: {type: integer}
            employeesWithPoints: {type: integer}
            activeLast30Days: {type: integer}
        campaigns:
          type: array
          maxItems: 20
          items:
            type: object
            required: [campaignId, title, isPriority, status, opensAt, closesAt, reposters, externalSharesApproved, points]
            properties:
              campaignId: {type: string}
              title: {type: string}
              isPriority: {type: boolean}
              status: {$ref: "#/components/schemas/CampaignStatus"}
              opensAt: {type: string, format: date-time}
              closesAt: {type: string, format: date-time}
              reposters: {type: integer}
              externalSharesApproved: {type: integer}
              points: {type: integer}
              announcement: {type: string, nullable: true, enum: [QUEUED, SENT, FAILED, null]}
        shareHealth:
          type: object
          required: [windowStart, queued, published, failed, failedByReason]
          properties:
            windowStart: {type: string, format: date-time, description: "The 1st of the current month, 00:00 UTC"}
            queued: {type: integer}
            published: {type: integer}
            failed: {type: integer}
            failedByReason: {type: object, additionalProperties: {type: integer}}
        recentCorrections:
          type: array
          maxItems: 10
          items:
            type: object
            required: [reference, type, employeeId, points, actorId, createdAt]
            properties:
              reference: {type: string}
              type: {type: string, enum: [ADJUSTMENT, REVERSAL]}
              employeeId: {type: string}
              email: {type: string, nullable: true}
              points: {type: integer}
              reason: {type: string, nullable: true}
              actorId: {type: string}
              createdAt: {type: string, format: date-time}

    Announcement:
      type: object
      required: [campaignId, status, space, queuedAt]
      properties:
        campaignId: {type: string}
        status: {type: string, enum: [QUEUED, SENT, FAILED]}
        space: {type: string}
        queuedAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, nullable: true}
        failedAt: {type: string, format: date-time, nullable: true}
        lastError: {type: string, nullable: true}
    AnnouncementSend:
      type: object
      required: [campaignId, status]
      properties:
        campaignId: {type: string}
        status: {type: string, enum: [QUEUED]}
    AnnouncementList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Announcement"}}
    Setting:
      type: object
      required: [key, value, version, updatedBy, updatedAt]
      properties:
        key: {type: string}
        value: {description: "JSON value (number, boolean or string)"}
        version: {type: integer}
        updatedBy: {type: string}
        updatedAt: {type: string, format: date-time}
    SettingList:
      type: object
      required: [settings]
      properties:
        settings: {type: array, items: {$ref: "#/components/schemas/Setting"}}
        schedulerSync:
          type: string
          enum: [SYNCED, PENDING, NOT_CONFIGURED]
          description: Only on a PUT that changed a schedule setting (ADR-026)
        coins:
          type: object
          description: Admin view only (`/admin/settings`), not `/po/settings`. Whether the WSO2 Coins service is set up, from the client in memory (no call to it); shown beside `coin.wallets_enabled` (ADR-048)
          required: [connected, breaker]
          properties:
            connected: {type: boolean, description: "The Coins URL, token endpoint and credentials are configured"}
            breaker: {$ref: "#/components/schemas/BreakerState"}
    SchedulerSync:
      type: object
      required: [schedulerSync, jobs]
      properties:
        schedulerSync: {type: string, enum: [SYNCED, PENDING, NOT_CONFIGURED]}
        jobs:
          type: array
          items:
            type: object
            required: [id, schedule, enabled, result]
            properties:
              id: {type: string}
              schedule: {type: string}
              enabled: {type: boolean}
              result: {type: string, enum: [CREATED, UPDATED, UNCHANGED, FAILED, SKIPPED]}
    SettingChanges:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [key, value, version]
            properties:
              key: {type: string}
              value: {description: New JSON value}
              version: {type: integer, minimum: 1}
