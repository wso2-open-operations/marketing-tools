  /me/coins/wallet:
    post:
      tags: [S4 Recognition]
      operationId: captureMyCoinsWallet
      x-access: EMPLOYEE
      description: >-
        Captures the caller's WSO2 Coins wallet for the automatic Coins conversion (ADR-048). amplify-api asks the WSO2
        Coins transaction service for the caller's wallets (`GET /wallets/me`) with its own service token and the
        caller's backend JWT forwarded as `X-User-Assertion`, takes the default wallet (else the first) and stores it.
