  /leaderboard:
    get:
      tags: [S4 Recognition]
      operationId: getLeaderboard
      x-access: EMPLOYEE
      description: "Company top N, personal, and My Team (leaderboards.md, B15). ETag `<period>:<standing_version>:<viewer>` with `Cache-Control: private, no-cache`, so the browser revalidates on every use and new points show on the next request after they are awarded (a repost is queued and scored when Amplify Jobs publishes it); `If-None-Match` gives 304 with the same two headers. When the roster lookup failed (`teamStatus = UNAVAILABLE` with a roster configured) the body has no ETag and is `Cache-Control: no-store`, so it is never revalidated into a stale My Team."
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/Period"}
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        "200":
          description: OK
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Leaderboard"}
        "304":
          description: Not modified
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /leaderboard/top:
    get:
      tags: [S4 Recognition]
      operationId: getLeaderboardTop
      x-access: EMPLOYEE
      description: "The Celebrate top three and the caller's own position, company wide. The scope is the `leaderboard.top_scope` setting: `MONTH` (default) covers the current calendar month, the 1st 00:00 UTC to the next 1st, summed from the points ledger; `ALL` is the all-time standings. Everyone with points this month is ranked (no minimum). Monthly totals are shared by every caller and kept in memory until points change: each request compares the `ALL` standing version, which every ledger write bumps, with the one the totals were read at, and reloads when it moved. `topBoardCacheSeconds` (default 2 hours) caps the reuse when nothing changes or the version can't be read; a failed reload serves the previous totals of the same month. `Cache-Control: private, no-cache`, so new points show on the next request after they are awarded. A repost is only accepted into a queue (`202`): its points, and the `ALL` standing version, change when Amplify Jobs publishes it, so a request made before that still returns the previous points. `me` comes from the same totals, so it matches the top three (ADR-037). People tied on points are listed by who reached them first (earliest `reachedAt`), then name."
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
      responses:
        "200":
          description: OK
          headers:
            Cache-Control: {schema: {type: string}, description: "private, no-cache"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaderboardTop"}
        "401": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /leaderboard/people:
    get:
      tags: [S4 Recognition]
      operationId: getLeaderboardPeople
      x-access: EMPLOYEE
      description: "People ranked within the whole company, a business unit (BU) or a team. Open to every employee (ADR-035). `BU` and `TEAM` default to the caller's own when `bu` / `team` is omitted; the team key is the opaque `key` from `/headcount` or `/leaderboard/groups`. Membership comes from the people directory, so `BU` and `TEAM` answer 503 `DEPENDENCY_UNAVAILABLE` when it has never loaded."
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/Period"}
        - {name: scope, in: query, schema: {type: string, enum: [COMPANY, BU, TEAM], default: COMPANY}}
        - {name: bu, in: query, schema: {type: string, maxLength: 100}}
        - {name: team, in: query, schema: {type: string, maxLength: 200}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Size"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LeaderboardPeople"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /leaderboard/groups:
    get:
      tags: [S4 Recognition]
      operationId: getLeaderboardGroups
      x-access: EMPLOYEE
      description: "All teams (or one BU's teams), or all BUs, ranked against each other by the sum of their members' points. Open to every employee (ADR-035). Teams with no points are listed with 0. Participation is people with points over the employee count (`/headcount`). People the directory doesn't place are summed in `unassigned`, never dropped."
      parameters:
        - {$ref: "#/components/parameters/CorrelationId"}
        - {$ref: "#/components/parameters/Period"}
        - {name: by, in: query, schema: {type: string, enum: [TEAM, BU, HOUSE], default: TEAM}}
        - {name: bu, in: query, description: "Only the teams in this BU (by=TEAM only)", schema: {type: string, maxLength: 100}}
        - {name: sort, in: query, description: "Column to order by; rank is the points-based dense rank", schema: {type: string, enum: [rank, name, points, participants, headcount, participation], default: rank}}
        - {name: dir, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        "200":
          description: OK
          content:
