# Choreo component descriptor for the conference backend.
#
# The component root is `apps/conference/backend`, so every path below is
# resolved relative to that directory (not the repository root).
#
# +required Schema version
schemaVersion: 1.2

# Required production configuration/environment variables (set in the Choreo
# console, not in this file). As of the fail-closed auth change, the backend
# REFUSES TO BOOT in production (APP_ENV=production, the default) unless JWT
# signature validation is configured, or it exit(1)s and crash-loops:
#   TOKEN_VALIDATOR_ENABLED=true   turns on JWT signature + expiry verification
#   JWKS_ENDPOINT                  JWKS URL to fetch signing keys from
#   JWT_ISSUER                     expected `iss` claim
#   JWT_AUDIENCE                   accepted `aud` claims -- a comma-separated
#                                  list of Asgardeo client ids; a token passes
#                                  if its aud matches ANY one of them. Needs
#                                  every application that calls this backend:
#                                  the attendee microapp and the service
#                                  application the AI service uses for its own
#                                  reads. A single value still works unchanged.
# Confirm the exact JWKS/issuer/audience with the platform team (they depend on
# whether the gateway forwards the IdP token or substitutes its own assertion).
#
# The AI routes additionally need credentials for the AI service's gateway:
#   AI_SERVICE_URL       the AI service's endpoint URL
#   AI_TOKEN_URL         Asgardeo token endpoint (same one the wallet, QR portal
#                        and transaction integrations already use)
#   AI_CLIENT_ID         OAuth2 application subscribed to the AI service's API
#   AI_CLIENT_SECRET
# The AI service is published at Organization network visibility, which limits
# *who can reach* it but does not make it unauthenticated: its gateway still
# demands a token. Without these, every AI route answers 500 while the gateway
# is really returning 401 {"code":"900901"}. Set AI_CLIENT_ID, AI_CLIENT_SECRET
# and AI_TOKEN_URL all three or none -- a partial set fails at startup.
# AI_SERVICE_URL is separate from that rule and is always required.
#
# The admin broadcast (POST /users/notifications) needs both of the following.
# One gates who may call the route; the other is how this backend reaches the
# service that delivers the push:
#   RBAC_ADMIN_ROLES   comma-separated JWT `groups` values allowed to broadcast.
#                      Empty DENIES every caller rather than allowing every
#                      caller, so an unset value looks like a broken route, not
#                      an open one.
#
# The admin AI-management routes gate on their own group list, kept separate from
# RBAC_ADMIN_ROLES because they write into every attendee's recommendations and
# con-ai enforces no authorisation of its own -- this list is the only gate:
#   AI_ADMIN_ROLES     comma-separated JWT `groups` values allowed to manage the
#                      O2Bar engineer roster (POST/GET/DELETE /admin/o2bar/
#                      engineers, GET /admin/o2bar/engineers/exists) and attendee
#                      AI profiles (POST/GET/PATCH/DELETE /admin/ai-profiles, GET
#                      /admin/ai-profiles/exists). Empty DENIES every caller.
#   NOTIFICATION_ENDPOINT        push-notification-gateway-api's Choreo URL,
#                                version suffix included -- e.g. staging's
#                                https://apis-stg.wso2.com/urwb/push-notification-gateway/v1.0
#                                This is the Public component that fronts the
#                                Organization-visibility push-notification-
#                                service; it is NOT the notification service's
#                                own URL.
#   NOTIFICATION_TOKEN_URL       Asgardeo token endpoint, as above
#   NOTIFICATION_CLIENT_ID       OAuth2 client whose id is on the gateway's
#                                ALLOWED_CLIENT_IDS list -- that gateway
#                                authorises by reading the `client_id` claim of
#                                the inbound Bearer token, so a valid token from
#                                an unlisted client is still rejected
#   NOTIFICATION_CLIENT_SECRET
#   NOTIFICATION_SCOPES          comma-separated; unlike the wallet/QR-portal/
#                                transaction integrations, this IdP client needs
#                                its scopes requested explicitly
# Set NOTIFICATION_ENDPOINT, NOTIFICATION_TOKEN_URL, NOTIFICATION_CLIENT_ID and
# NOTIFICATION_CLIENT_SECRET all four or none -- a partial set fails at startup.
# NOTIFICATION_SCOPES sits outside that rule: it is never validated, which does
# not make it dispensable. All four empty still boots, because a deployment that
# never broadcasts has nothing to configure. Note that the `notifications` feature
# flag defaults to ON (it is seeded '1' in the app_config table, not set here),
# so an environment that leaves this block empty still advertises the feature
# and fails the call.
#
# This file carries these as comments only: it declares no `configurations:`
# entries, so nothing here sets the variables. They must still be entered by
# hand in the Choreo console.

endpoints:
  # +required Unique name for the endpoint (lowercase alphanumeric + dashes).
  - name: conference-backend-v2
    # +optional Display name shown in the Choreo console.
    displayName: Conference Backend V2
    # +required Service section
    service:
      # +required Base path the service is exposed on. The Go router mounts
      # every route at the root (/health, /sessions, /events, ...).
      basePath: /
      # +required Port the container listens on. Matches the PORT default in
      # internal/config/config.go and .env.example.
      port: 8080
    # +required Endpoint type
    type: REST
    # +required Network level visibility of the endpoint.
    networkVisibilities:
      - Public
    # +optional Path to the OpenAPI definition, relative to the component root.
    # This is the spec added in this PR and is the contract the frontend
    # generates its types from.
    schemaFilePath: openapi.yaml
